# RELAY by PASDACS: PostgreSQL settings that come with the image (included from /data/postgres/postgresql.conf).
# No network listener: the web app connects over the Unix socket, and each Linux user signs in as its own role.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'
hba_file = '/etc/relay/pg_hba.conf'
ident_file = '/etc/relay/pg_ident.conf'

max_connections = 50
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB
wal_level = replica
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Logs go to the container's log, one line each
logging_collector = off
log_destination = 'stderr'
log_line_prefix = 'database %m [%p] '
log_min_duration_statement = 5000
log_checkpoints = off
log_timezone = 'UTC'
timezone = 'UTC'

; RELAY by PASDACS: the parts of the platform inside the one container, run by supervisord.
; Each part runs as its own user with its own settings (docker/launch.py); output goes to the container's log.
; relay-init writes the running copy to /run/relay/supervisord.conf (readable by root and the web app only), with a
; new random password for the control socket and the parts to start, at every start.
;   docker exec relay relay-ctl status            what runs
;   docker exec relay relay-ctl restart <part>    web | agent | database | gateway

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/run/relay/supervisord.pid
childlogdir=/run/relay
minfds=4096

[unix_http_server]
file=/run/relay/supervisor.sock
chmod=0770
chown=root:relay
username=relay
password={{CONTROL_PASSWORD}}

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/relay/supervisor.sock
username=relay
password={{CONTROL_PASSWORD}}

; The database: PostgreSQL 17 on the Unix socket only. SIGINT = fast shutdown (rolls back open transactions).
[program:database]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres
user=postgres
autostart={{DATABASE_AUTOSTART}}
autorestart=true
priority=10
startsecs=5
startretries=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The AI engine: Claude Code and the other CLIs behind one service, on 127.0.0.1 only. One run at a time per lane.
[program:agent]
command=/opt/relay/bin/launch agent uvicorn server:app --host 127.0.0.1 --port 8090 --no-access-log --timeout-graceful-shutdown 20
directory=/opt/genbi
user=agent
umask=002
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The web app: what people use, on port 8000. It waits for the database before it starts.
[program:web]
command=/opt/relay/bin/launch web uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --timeout-graceful-shutdown 20
directory=/srv
user=relay
umask=002
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=40
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The AI gateway (LiteLLM) for Amazon Bedrock, Azure AI Foundry and Google Vertex AI: on 127.0.0.1 only. It starts
; when a cloud AI provider has routes; the web app restarts it after a change.
[program:gateway]
command=/opt/relay/bin/launch gateway /opt/relay/bin/gateway
directory=/opt/relay/gateway-app
user=relay
autostart={{GATEWAY_AUTOSTART}}
autorestart=true
priority=40
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=20
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The watchdog: a part that cannot start stops the container (Docker's restart policy starts it fresh), and a part
; that stops answering its health check for 5 minutes is restarted.
[eventlistener:watchdog]
command=/opt/relay/bin/watchdog
events=PROCESS_STATE_FATAL,TICK_60
priority=50
autorestart=true
buffer_size=100
stdout_logfile=NONE
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

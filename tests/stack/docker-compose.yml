# D2D Relay's test stack, never the live one: the layout of the repository's docker-compose.yml with its own names,
# volumes and ports (127.0.0.1:8103 public site, 8104 admin portal, 8105 stand-in Razorpay, 8106 stand-in Microsoft
# APIs for Semantic Review), no mail (sign-in codes are printed to the web and admin logs), no Claude sign-in unless
# TEST_CLAUDE_VOLUME names one, and a stand-in Razorpay API (../checks/fake_razorpay.py, started inside the web container
# on port 9911 by stack.sh; item 59 took it away with buying credits online, item 85 brought both back).
# Start it with stack.sh (../README.md). stack.sh writes the settings to .env in this folder (git-ignored), so later
# `docker compose -p d2d-relay-test ...` commands run IN THIS FOLDER see the same ones, `down -v` included. Never run
# them from the repository root: the docker-compose.yml there is live's, and its volumes are live's.
# Keys that look live (rzp_live_...) so the live path runs (selling switched on by an admin); the API is the stand-in.
# Optional: CODE_APP=<repo>/webapp/app CODE_APP_AT=/srv/app (and CODE_STATIC/CODE_STATIC_AT for webapp/static) mount
# the working tree's code over the image's, read-only; stack.sh blanks them so the image itself is tested.
name: d2d-relay-test

x-app: &app
  image: ${TEST_IMAGE:?set TEST_IMAGE to the image to test, e.g. d2d-relay:54f6ed7}
  security_opt:
    - no-new-privileges:true

x-signin: &signin
  RELAY_AUTH: otp
  RELAY_OTP_EMAIL: info@pasdacs.com
  RELAY_ADMIN_EMAIL: info@pasdacs.com
  RELAY_OTP_DEV_LOG: "1"
  RELAY_TEST_LOGIN: "1"
  # the stand-in's made-up keys (stack.sh's; the same defaults here, so compose commands on a stack started before
  # item 85, whose .env has none, still read this file)
  RELAY_RAZORPAY_KEY_ID: ${TEST_RZP_KEY_ID:-rzp_live_D2DTESTSTACK01}
  RELAY_RAZORPAY_KEY_SECRET: ${TEST_RZP_SECRET:-stand-in-key-secret-not-real}
  RELAY_RAZORPAY_WEBHOOK_SECRET: ${TEST_RZP_WEBHOOK:-stand-in-webhook-secret-not-real}
  RELAY_RAZORPAY_API: ${TEST_RZP_API:-http://d2d-relay-test-web:9911/v1}
  RELAY_PAYMENTS_TEST_FOR: ${TEST_PAYMENTS_FOR:-platform}
  # item 40: the bot check, with Cloudflare's published test keys (they always pass); set them empty to turn it off
  RELAY_TURNSTILE_SITE_KEY: ${TEST_TURNSTILE_SITE_KEY-1x00000000000000000000AA}
  RELAY_TURNSTILE_SECRET: ${TEST_TURNSTILE_SECRET-1x0000000000000000000000000000000AA}
  # item 42: the installation's Anthropic API key (empty: the Claude login only); a real-Claude test sets it
  RELAY_ANTHROPIC_API_KEY: ${TEST_ANTHROPIC_API_KEY-}
  # item 55: Semantic Review's Power BI connection talks to the stand-in Microsoft APIs (../checks/fake_powerbi.py, port
  # 9912 in the web container, 127.0.0.1:8106 here); uploads up to 20 MB so the size limit can be tried
  RELAY_ENTRA_LOGIN: ${TEST_ENTRA_LOGIN:-http://d2d-relay-test-web:9912/login}
  RELAY_FABRIC_API: ${TEST_FABRIC_API:-http://d2d-relay-test-web:9912/fabric}
  RELAY_POWERBI_API: ${TEST_POWERBI_API:-http://d2d-relay-test-web:9912/powerbi}
  RELAY_REVIEW_MAX_MB: ${TEST_REVIEW_MAX_MB:-20}
  # item 70: pushing a dashboard's Power BI project to GitHub talks to the stand-in GitHub API (../checks/fake_github.py,
  # started inside the web container on port 9913 by item70_check.py; no port on this PC)
  RELAY_GITHUB_API: ${TEST_GITHUB_API:-http://d2d-relay-test-web:9913}

services:
  db:
    <<: *app
    container_name: d2d-relay-test-db
    environment:
      RELAY_ROLE: database
      RELAY_DB_PASSWORD: ${TEST_DB_PASSWORD:?}
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "/opt/relay/bin/relay-ctl", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 180s
      start_interval: 3s

  web:
    <<: *app
    container_name: d2d-relay-test-web
    environment:
      <<: *signin
      RELAY_ROLE: web
      RELAY_DATABASE_URL: postgresql://relay_app:${TEST_DB_PASSWORD}@d2d-relay-test-db:5432/relay
      RELAY_PUBLIC_URL: http://127.0.0.1:8103
      # off for the suites (they read codes from the log); TEST_WEB_OTP_ON_SCREEN=1 shows them on the sign-in page, for a
      # person trying the stack in a browser on this PC (item 57; an empty value is not passed on, so it stays off)
      RELAY_OTP_ON_SCREEN: ${TEST_WEB_OTP_ON_SCREEN-}
    volumes:
      - web-data:/data
      - ./test-projects:/data/projects           # as live: the projects in a folder of their own (item 31's job runner)
      - test-claude:/home/agent/.claude          # an empty sign-in, or the live one for a real-Claude test
      - test-runner-sock:/run/relay-runner
      - ${CODE_APP:-./empty-app}:${CODE_APP_AT:-/opt/unused-app}:ro
      - ${CODE_STATIC:-./empty-static}:${CODE_STATIC_AT:-/opt/unused-static}:ro
    ports:
      - "127.0.0.1:8103:8000"
      - "127.0.0.1:8105:9911"                    # the stand-in Razorpay (fake_razorpay.py)
      - "127.0.0.1:8106:9912"                    # item 55: the stand-in Microsoft APIs (fake_powerbi.py)
    cap_add:                 # as the live web container (security audit S6)
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy

  admin:
    <<: *app
    container_name: d2d-relay-test-admin
    environment:
      <<: *signin
      RELAY_ROLE: admin
      RELAY_DATABASE_URL: postgresql://relay_app:${TEST_DB_PASSWORD}@d2d-relay-test-db:5432/relay
      RELAY_PUBLIC_URL: http://127.0.0.1:8104
      # item 59: the public site's address, for links in emails the admin portal sends (as live's RELAY_SITE_URL)
      RELAY_SITE_URL: http://127.0.0.1:8103
      # item 57: the admin portal shows sign-in codes on its sign-in page to requests made on this PC (item57_check.py);
      # the public site keeps them off, so its suites see the emailed path and the Turnstile widget
      RELAY_OTP_ON_SCREEN: ${TEST_OTP_ON_SCREEN-1}
    volumes:
      - admin-data:/data
      - ${CODE_APP:-./empty-app}:${CODE_APP_AT:-/opt/unused-app}:ro
      - ${CODE_STATIC:-./empty-static}:${CODE_STATIC_AT:-/opt/unused-static}:ro
    ports:
      - "127.0.0.1:8104:8000"
    depends_on:
      db:
        condition: service_healthy

  # Careful: when it starts, the job runner removes EVERY container labelled d2d-relay.job=1 on this PC, live's
  # included (docker/job_runner.py, sweep()). stack.sh refuses to start the stack while such a container exists.
  runner:
    image: ${TEST_IMAGE:?set TEST_IMAGE to the image to test, e.g. d2d-relay:54f6ed7}
    container_name: d2d-relay-test-runner
    healthcheck:                   # the runner answers on its Unix socket (not the image's relay-ctl check)
      test: ["CMD", "test", "-S", "/run/relay-runner/runner.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/python3", "-P", "/opt/relay/bin/job-runner"]
    user: root
    network_mode: none
    environment:
      D2D_JOB_WEB_CONTAINER: d2d-relay-test-web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - test-runner-sock:/run/relay-runner
    security_opt:
      - no-new-privileges:true

volumes:
  # A real-Claude test mounts live's sign-in: TEST_CLAUDE_VOLUME=claude-api-auth ALWAYS with TEST_CLAUDE_EXTERNAL=true
  # (external, so `down -v` never deletes it). Never name claude-api-auth with external false.
  test-claude:
    name: ${TEST_CLAUDE_VOLUME:-d2d-relay-test-claude}
    external: ${TEST_CLAUDE_EXTERNAL:-false}
  test-runner-sock:
    name: d2d-relay-test-runner-sock
  db-data:
    name: d2d-relay-test-db-data
  web-data:
    name: d2d-relay-test-web-data
  admin-data:
    name: d2d-relay-test-admin-data

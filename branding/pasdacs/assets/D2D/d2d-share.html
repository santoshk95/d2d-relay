<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Manrope";src:url("../../../../webapp/static/fonts/manrope-latin.woff2") format("woff2");font-weight:200 800}
@font-face{font-family:"Inter";src:url("../../../../webapp/static/fonts/inter-latin-400-700.woff2") format("woff2");font-weight:400 700}
html,body{margin:0;width:1200px;height:630px}
body{position:relative;overflow:hidden;box-sizing:border-box;padding:64px 80px 0;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#111111,#1C1C1C 55%,#262626);color:#FFFFFF;font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.glow{position:absolute;right:-170px;top:-230px;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,196,140,.20),transparent 65%);pointer-events:none}
.logo svg{height:72px;width:auto;display:block}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;position:relative}
.eyebrow{font:700 21px/1 "Manrope",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#33D6A6;margin:0 0 20px}
h1{font:800 72px/1.04 "Manrope",sans-serif;letter-spacing:-.03em;margin:0;max-width:960px}
p{font:400 27px/1.45 "Inter",sans-serif;color:#E5E5E5;margin:24px 0 0;max-width:900px}
.foot{height:104px;display:flex;align-items:center;font:600 24px/1 "Inter",sans-serif;color:#A3A3A3;position:relative}
.bar{position:absolute;left:0;right:0;bottom:0;height:20px;background:#00C48C}
</style>
</head>
<body>
<div class="glow"></div>
<div class="logo"><svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="D2D, Data to Decision"><rect x="2" y="2" width="44" height="44" rx="11" fill="#FFFFFF"/><path d="M13.5 14.6a1.6 1.6 0 0 1 1.6 -1.6H24.5A11 11 0 0 1 32.34 16.28H13.5Z" fill="#111111"/><path d="M13.5 17.68H33.5A11 11 0 0 1 35.07 20.96H13.5Z" fill="#111111"/><path d="M13.5 22.36H35.38A11 11 0 0 1 35.38 25.64H13.5Z" fill="#00C48C"/><path d="M13.5 27.04H35.07A11 11 0 0 1 33.5 30.32H13.5Z" fill="#111111"/><path d="M13.5 31.72H32.34A11 11 0 0 1 24.5 35H15.1a1.6 1.6 0 0 1 -1.6 -1.6Z" fill="#111111"/><text x="60" y="27" font-family="Manrope, sans-serif" font-size="23" font-weight="800" letter-spacing="3" fill="#FFFFFF">D2D</text><text x="61" y="42" font-family="Manrope, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#A3A3A3">DATA TO DECISION</text></svg></div>
<div class="main">
  <div class="eyebrow">D2D Relay by PASDACS</div>
  <h1>Your data to a Power BI dashboard.</h1>
  <p>Bring your CSV files, describe the dashboard you need, and get a Power BI file (.pbix) with every number checked.</p>
</div>
<div class="foot">d2d.pasdacs.com</div>
<div class="bar"></div>
</body>
</html>

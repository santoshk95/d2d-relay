<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111111">
<title>D2D Relay</title>
<link rel="icon" href="favicon.ico" sizes="32x32">

<script>try{const t=JSON.parse(localStorage.getItem('d2d.theme'));if(t==='dark'||(t==null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}</script>
</head>
<body>
<div class="app">
  <header class="mbar">
    <button class="iconbtn" id="menubtn" type="button" aria-label="Menu" aria-controls="side" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="mlogo" id="mlogo" href="#/" aria-label="Home"></a>
    <span class="spacer"></span>
    <button class="iconbtn" id="msearchbtn" type="button" aria-label="Search"><svg class="i" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg></button>
  </header>
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="sidehead">
      <a class="logo" id="brandlogo" href="#/" aria-label="Home"></a>
      <button class="iconbtn railbtn" id="railbtn" type="button" aria-controls="side"></button>
    </div>
    <a class="btn primary new" href="#/new" id="newbtn"></a>
    <div class="sidescroll">
      <nav class="nav" id="nav"></nav>
      <div class="recent" id="pinbox" hidden><div id="pinhead"></div><div id="pinlist"></div></div>
      <div class="recent" id="recentbox"><div id="recenthead"></div><div id="plist"></div></div>
    </div>
    <div class="powered" id="powered"></div>
  </aside>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <div class="mainwrap">
    <header class="topbar" id="topbar">
      <button class="navsearch" id="searchbtn" type="button" aria-label="Search and go anywhere"><svg class="i" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg><span class="lbl">Search modules, dashboards, pages…</span><kbd>Ctrl K</kbd></button>
      <div id="ws" class="wschip" hidden></div>
      <div id="orgchip" class="orgchip" hidden></div>
      <span class="spacer"></span>
      <div class="sys" id="sys"><div id="agent" class="health"><b></b><span>Checking the agent…</span></div><div id="daxchk" class="health"><b></b><span>DAX checker</span></div></div>
      <button class="iconbtn" id="bellbtn" type="button" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg></button>
      <button class="iconbtn" id="themebtn" type="button" aria-label="Dark mode"></button>
      <div id="me" class="me"></div>
    </header>
    <div id="actband" class="actband" role="status" hidden></div>
    <main id="main"></main>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

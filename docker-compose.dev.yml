# RELAY by PASDACS: the development and test stack, one container per part (web app, AI engine, orchestrator, AI
# gateway, PostgreSQL, the other AI CLIs). The test suites (tests/run_all.sh) and Relay Doctor's proofs use the
# images it builds (gen-bi-webapp, gen-bi-agent, ...); Kubernetes (deploy/kubernetes) uses the same images.
# Day-to-day Relay runs as ONE container: docker-compose.yml (see docs/single-container.md).
#   docker compose -f docker-compose.dev.yml build             the per-part images for the test suites
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d   this stack instead of the one container
#                                                                 (stop the one container first: same port)
name: gen-bi

services:
  # The AI engine: Claude Code running as an agent in the project folder, with file tools and the
  # genbi toolkit only (no web, no sub-agents). Reuses the login of C:\Users\santosh.k\claude-api
  # (the claude-api-auth volume). One run at a time.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args: {RELAY_COMMIT: "${RELAY_COMMIT:-}"}   # the commit the image is built from (Relay Doctor)
    environment:
      AGENT_MODEL: sonnet             # default for new dashboards
    volumes:
      - claude-auth:/home/node/.claude
      - ./output/projects:/data/projects
      # models.json: the Claude models this login can use (agent/probe_models.py); edits apply without a restart
      - ./config:/opt/genbi/config:ro
      # the visual library: custom visuals built for earlier reports (the web app adds new ones after each run)
      - ./visual-library:/opt/genbi/library:ro
    restart: unless-stopped

  # The web app: uploads, KPI confirmation, prototype review, Power BI build. Talks only to the agent.
  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      args: {RELAY_COMMIT: "${RELAY_COMMIT:-}"}   # the commit the image is built from (Relay Doctor)
    environment:
      AGENT_URL: http://agent:8090
      HOST_PROJECTS_DIR: ${HOST_PROJECTS_DIR:-}
      GENBI_LIBRARY: /opt/genbi/library
      HOST_LIBRARY_DIR: ${HOST_LIBRARY_DIR:-}
      # Platform base (phase 0). single = one local user, the bootstrap admin (the app works as before login).
      D2D_AUTH: ${D2D_AUTH:-single}
      D2D_INSTANCE: ${D2D_INSTANCE:-local}
      D2D_ADMIN_EMAIL: ${D2D_ADMIN_EMAIL:-admin@local}
      D2D_STATE: /data/state
      D2D_BACKUPS: /data/backups
      # Phase 2: per-person workspaces (off = every run uses the shared agent, as before) and the LiteLLM gateway
      D2D_INSTANCES: ${D2D_INSTANCES:-off}
      D2D_IDLE_MINUTES: ${D2D_IDLE_MINUTES:-30}
      D2D_ORCHESTRATOR_URL: http://orchestrator:8095
      D2D_LITELLM_URL: http://litellm:4000
      D2D_LITELLM_DIR: /data/llm
      # Phase 8: Postgres instead of the SQLite file (empty = SQLite). Start the `postgres` profile and move the
      # data first: see platform-plan.md, phase 8.
      D2D_DATABASE_URL: ${D2D_DATABASE_URL:-}
      # Phase 8: GET /metrics for a Prometheus scraper (empty = off)
      D2D_METRICS_TOKEN: ${D2D_METRICS_TOKEN:-}
      # P16 Self-healing: 0 = a failure with no built-in or learned rule waits for a person to click Diagnose;
      # 1 = it starts an AI diagnosis by itself (agent cost, uses the build lane). Known failures use their rule at once.
      HEAL_AUTO_DIAGNOSE: ${HEAL_AUTO_DIAGNOSE:-0}
    volumes:
      - ./output/projects:/data/projects
      - ./config:/opt/genbi/config:ro
      - ./visual-library:/opt/genbi/library
      # the index database (owners, durable job queue, audit) and the encrypted secrets store
      - d2d-state:/data/state
      # nightly backups of the database and the project folders, on the host
      - ./output/backups:/data/backups
      # the LiteLLM gateway's config (routes, provider credentials, signing key): written here, read by litellm
      - d2d-llm:/data/llm
      # the orchestrator's access token (read only)
      - d2d-orch:/data/orch:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "10.20.0.100:8000:8000"   # the office network (Windows Firewall rule "Relay 8000")
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

  # Phase 2: the only service with the Docker socket. Creates, starts, stops and removes per-person workspace
  # instances (containers of the agent image) on the web app's request; enforces the capacity cap.
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    environment:
      D2D_AGENT_IMAGE: gen-bi-agent:latest
      D2D_NETWORK: gen-bi_default
      D2D_MAX_INSTANCES: ${D2D_MAX_INSTANCES:-10}
      D2D_INSTANCE_CPUS: ${D2D_INSTANCE_CPUS:-2}
      D2D_INSTANCE_MEMORY_GB: ${D2D_INSTANCE_MEMORY_GB:-4}
      HOST_PROJECTS_DIR: ${HOST_PROJECTS_DIR:-}
      HOST_LIBRARY_DIR: ${HOST_LIBRARY_DIR:-}
      AGENT_MODEL: sonnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - d2d-orch:/data/orch
    restart: unless-stopped

  # Phase 2: LiteLLM gateway — Claude Code reaches Amazon Bedrock, Azure AI Foundry and Google Vertex AI through its
  # Anthropic-compatible API; only keys signed by the web app for one run are accepted (litellm/d2d_auth.py).
  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile
    volumes:
      - d2d-llm:/data/llm:ro
    restart: unless-stopped

  # Phase 8: other agent CLIs, each in its own image (the agent image + that CLI), serving only that runner.
  # Opt-in: `docker compose --profile runners build` (after `build agent`), then `--profile runners up -d`.
  # A person picks one in Settings with their own API key; it gets no other credentials.
  agent-codex:
    build: {context: ., dockerfile: agent/Dockerfile.runner, args: {RUNNER: codex}}
    image: gen-bi-agent-codex:latest
    profiles: ["runners"]
    volumes: &runner-volumes
      - ./output/projects:/data/projects
      - ./config:/opt/genbi/config:ro
      - ./visual-library:/opt/genbi/library:ro
    restart: unless-stopped
  agent-gemini:
    build: {context: ., dockerfile: agent/Dockerfile.runner, args: {RUNNER: gemini}}
    image: gen-bi-agent-gemini:latest
    profiles: ["runners"]
    volumes: *runner-volumes
    restart: unless-stopped
  agent-antigravity:
    build: {context: ., dockerfile: agent/Dockerfile.runner, args: {RUNNER: antigravity}}
    image: gen-bi-agent-antigravity:latest
    profiles: ["runners"]
    environment:
      AGY_SHARED_LOGIN: /opt/agy-login
    volumes:
      - ./output/projects:/data/projects
      - ./config:/opt/genbi/config:ro
      - ./visual-library:/opt/genbi/library:ro
      # the Google login of the separate antigravity-api gateway (Downloads\antigravity-cli), read only: runs
      # without a person's Gemini key copy its token in (agent/runners.py, AntigravityRunner)
      - agy-auth:/opt/agy-login:ro
    restart: unless-stopped

  # Phase 8: Postgres for the index (opt-in): `docker compose --profile postgres up -d postgres`, then
  # `docker compose exec -e D2D_DATABASE_URL=... webapp python -m app.dbmove`, then set D2D_DATABASE_URL in .env.
  postgres:
    image: postgres:17.6-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: d2d
      POSTGRES_DB: d2d
      POSTGRES_PASSWORD: ${D2D_POSTGRES_PASSWORD:-change-me}
    volumes:
      - d2d-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "d2d"]
      interval: 10s
      retries: 6
    restart: unless-stopped

volumes:
  claude-auth:
    name: claude-api-auth
    external: true
  d2d-state:
    name: d2d-state
  d2d-llm:
    name: d2d-llm
  d2d-orch:
    name: d2d-orch
  d2d-pg:
    name: d2d-pg
  agy-auth:
    name: antigravity-api-auth
    external: true

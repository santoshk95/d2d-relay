# D2D Relay by PASDACS: Power BI dashboards from CSV files and Google BigQuery, in one container.
# Separate from RELAY by PASDACS (the folder ../Gen BI): its own image, container, database, projects and sign-in.
#   docker compose up -d                    the app on http://127.0.0.1:8100 (this PC only)
#   docker compose --profile tunnel up -d   plus the Cloudflare tunnel that serves https://d2d-relay.pasdacs.com
# Settings: .env (copy .env.example). Guide: docs/d2d-relay.md.
name: d2d-relay

services:
  d2d-relay:
    image: ${RELAY_IMAGE:-d2d-relay:latest}
    build:
      context: .
      args:
        RELAY_VERSION: ${RELAY_VERSION:-1.0.0}
        RELAY_COMMIT: ${RELAY_COMMIT:-}
        AGY_IMAGE: ${RELAY_AGY_IMAGE:-agy-download}
    container_name: d2d-relay
    hostname: d2d-relay
    env_file:
      - path: .env
        required: false
    environment:
      HOST_PROJECTS_DIR: ${HOST_PROJECTS_DIR:-}
      HOST_LIBRARY_DIR: ${HOST_LIBRARY_DIR:-}
    volumes:
      - d2d-data:/data
      - ${RELAY_PROJECTS:-./data/projects}:/data/projects
      - ${RELAY_BACKUPS:-./data/backups}:/data/backups
      - ${RELAY_LIBRARY:-./data/library}:/opt/genbi/library
      - ./config:/opt/genbi/config:ro
      # the AI engine's Claude sign-in (relay-ctl login inside this container, or an existing volume: RELAY_CLAUDE_*)
      - claude-login:/home/agent/.claude
      - agy-login:/opt/agy-login:ro
    ports:
      - "127.0.0.1:${RELAY_PORT:-8100}:8000"
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # https://d2d-relay.pasdacs.com -> this container, through Cloudflare (no port is opened on this PC).
  # The tunnel and its public hostname are made in the Cloudflare dashboard; its token goes in tunnel.env
  # (one line: TUNNEL_TOKEN=...), a file of its own so the app container never sees it.
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: d2d-relay-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    env_file:
      - path: tunnel.env
        required: false
    depends_on:
      - d2d-relay
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  d2d-data:
    name: d2d-relay-data
  claude-login:
    name: ${RELAY_CLAUDE_VOLUME:-d2d-relay-claude-login}
    external: ${RELAY_CLAUDE_EXTERNAL:-false}
  agy-login:
    name: ${RELAY_AGY_VOLUME:-d2d-relay-agy-login}
    external: ${RELAY_AGY_EXTERNAL:-false}

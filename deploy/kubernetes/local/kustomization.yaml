# One-node clusters (k3s, kind, Docker Desktop): shared claims become ReadWriteOnce (every pod is on the one node),
# images are the locally built ones (imported into the cluster), the web app is reached with port-forward.
#   cp deploy/kubernetes/secrets.example.env deploy/kubernetes/local/secrets.env   (then fill it in)
#   kubectl apply -k deploy/kubernetes/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
namespace: d2d
secretGenerator:
  - name: d2d-secrets
    envs: [secrets.env]
  - name: d2d-orch-token
    envs: [orch-token.env]
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: {kind: PersistentVolumeClaim, name: "d2d-projects|d2d-library|d2d-llm"}
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: ["ReadWriteOnce"]

# Optional component (sweep S9): the Codex, Gemini and Antigravity runners with their volumes. Add it to an overlay:
#   components:
#     - ../runners
# Build the images first: docker compose --profile runners build (then push them to your registry like the others).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - runners.yaml
images:
  - name: gen-bi-agent-codex
    newTag: latest
  - name: gen-bi-agent-gemini
    newTag: latest
  - name: gen-bi-agent-antigravity
    newTag: latest

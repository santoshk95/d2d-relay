# The shared agent (Claude Code headless): used when personal workspaces are off, and for rendering exports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      serviceAccountName: d2d
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: agent
          image: gen-bi-agent
          imagePullPolicy: IfNotPresent
          env:
            - {name: AGENT_MODEL, value: sonnet}
            # the installation's Claude login: `claude setup-token`, stored in the secret (optional)
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: {secretKeyRef: {name: d2d-secrets, key: claude-oauth-token, optional: true}}
          ports: [{containerPort: 8090, name: http}]
          readinessProbe:
            httpGet: {path: /health, port: 8090}
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: claude, mountPath: /home/node/.claude}
            - {name: projects, mountPath: /data/projects}
            - {name: config, mountPath: /opt/genbi/config, readOnly: true}
            - {name: library, mountPath: /opt/genbi/library, readOnly: true}
      volumes:
        - {name: claude, persistentVolumeClaim: {claimName: d2d-claude}}
        - {name: projects, persistentVolumeClaim: {claimName: d2d-projects}}
        - {name: config, configMap: {name: d2d-config, optional: true}}
        - {name: library, persistentVolumeClaim: {claimName: d2d-library}}
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector: {app: agent}
  ports: [{port: 8090, targetPort: 8090, name: http}]

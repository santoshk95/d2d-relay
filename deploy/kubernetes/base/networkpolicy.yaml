# Only the web app talks to the orchestrator, the agents, the gateway and Postgres. Workspaces (and the shared agent)
# may reach the gateway (LiteLLM routes) and the internet for their AI provider, nothing else inside the namespace.
# Needs a network plugin that enforces policies (Calico, Cilium, the k3s default...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: only-webapp-in
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [orchestrator, agent, postgres]}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: webapp}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspaces-from-webapp
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: d2d-workspace}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: webapp}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-agents
spec:
  podSelector:
    matchLabels: {app: litellm}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: webapp}}
        - podSelector: {matchLabels: {app: agent}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: d2d-workspace}}

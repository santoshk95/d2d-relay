# Shared volumes. Projects, the visual library and the gateway config are read and written by several pods
# (web app, shared agent, every person's workspace), so they need ReadWriteMany storage (Azure Files, EFS,
# Filestore, NFS...). The local overlay switches them to ReadWriteOnce for one-node clusters.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2d-projects
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2d-library
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2d-llm
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Mi
---
# the web app's own state: the encrypted secrets store, report files (the index itself is in Postgres)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2d-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# the shared agent's Claude login (personal workspaces each get their own claim from the orchestrator)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2d-claude
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

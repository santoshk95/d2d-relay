# LiteLLM gateway (phase 2): Bedrock / Azure AI Foundry / Vertex for Claude Code. The web app writes its config into
# the d2d-llm claim; the orchestrator restarts this Deployment to load it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      serviceAccountName: d2d
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: litellm
          image: gen-bi-litellm
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 4000, name: http}]
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: llm, mountPath: /data/llm, readOnly: true}]
      volumes:
        - {name: llm, persistentVolumeClaim: {claimName: d2d-llm}}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector: {app: litellm}
  ports: [{port: 4000, targetPort: 4000, name: http}]

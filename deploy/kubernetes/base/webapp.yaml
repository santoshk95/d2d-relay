# The web app. One replica: it runs the durable job worker, the schedulers and the watchdog in-process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: webapp}
  template:
    metadata:
      labels: {app: webapp}
    spec:
      serviceAccountName: d2d
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: webapp
          image: gen-bi-webapp
          imagePullPolicy: IfNotPresent
          env:
            - {name: AGENT_URL, value: "http://agent:8090"}
            - {name: GENBI_LIBRARY, value: /opt/genbi/library}
            - {name: D2D_AUTH, value: sso}                     # single only for a trial; sso for people
            - name: D2D_INSTANCE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: D2D_ADMIN_EMAIL, value: admin@local}
            - name: D2D_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: d2d-secrets, key: admin-password, optional: true}}
            - {name: D2D_STATE, value: /data/state}
            - {name: D2D_BACKUPS, value: /data/state/backups}
            - {name: D2D_INSTANCES, value: "on"}               # personal workspaces through the orchestrator
            - {name: D2D_IDLE_MINUTES, value: "30"}
            - {name: D2D_ORCHESTRATOR_URL, value: "http://orchestrator:8095"}
            - {name: D2D_ORCH_TOKEN_FILE, value: /data/orch/token}
            - {name: D2D_LITELLM_URL, value: "http://litellm:4000"}
            - {name: D2D_LITELLM_DIR, value: /data/llm}
            - name: D2D_DATABASE_URL
              valueFrom: {secretKeyRef: {name: d2d-secrets, key: database-url}}
            - name: D2D_METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: d2d-secrets, key: metrics-token, optional: true}}
            - name: D2D_SECRET_KEY
              valueFrom: {secretKeyRef: {name: d2d-secrets, key: secret-key, optional: true}}
          ports: [{containerPort: 8000, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: projects, mountPath: /data/projects}
            - {name: library, mountPath: /opt/genbi/library}
            - {name: config, mountPath: /opt/genbi/config, readOnly: true}
            - {name: state, mountPath: /data/state}
            - {name: llm, mountPath: /data/llm}
            - {name: token, mountPath: /data/orch, readOnly: true}
      volumes:
        - {name: projects, persistentVolumeClaim: {claimName: d2d-projects}}
        - {name: library, persistentVolumeClaim: {claimName: d2d-library}}
        - {name: config, configMap: {name: d2d-config, optional: true}}
        - {name: state, persistentVolumeClaim: {claimName: d2d-state}}
        - {name: llm, persistentVolumeClaim: {claimName: d2d-llm}}
        - name: token
          secret: {secretName: d2d-orch-token, items: [{key: token, path: token}]}
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  selector: {app: webapp}
  ports: [{port: 8000, targetPort: 8000, name: http}]

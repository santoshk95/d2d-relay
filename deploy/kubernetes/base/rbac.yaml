# The orchestrator may manage workspaces in this namespace only: Deployments (and their scale), Services and
# PersistentVolumeClaims. It cannot read Secrets, exec into pods or touch other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: d2d-orchestrator
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: d2d-orchestrator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d2d-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: d2d-orchestrator
subjects:
  - kind: ServiceAccount
    name: d2d-orchestrator
---
# every other D2D pod runs without Kubernetes API access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: d2d
automountServiceAccountToken: false

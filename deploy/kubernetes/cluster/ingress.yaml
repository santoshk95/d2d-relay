apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 200m      # CSV and image uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # streamed activity
spec:
  ingressClassName: nginx
  tls:
    - hosts: [d2d.example.com]
      secretName: d2d-tls
  rules:
    - host: d2d.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: webapp, port: {number: 8000}}}

# A shared cluster: images from your registry, ReadWriteMany storage for the shared claims, an ingress with TLS.
# Edit the registry, storage class and host below; secrets as in the local overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ingress.yaml
namespace: d2d
secretGenerator:
  - name: d2d-secrets
    envs: [secrets.env]
  - name: d2d-orch-token
    envs: [orch-token.env]
generatorOptions:
  disableNameSuffixHash: true
images:
  - {name: gen-bi-webapp, newName: registry.example.com/d2d/webapp, newTag: "2026.11.04"}
  - {name: gen-bi-agent, newName: registry.example.com/d2d/agent, newTag: "2026.11.04"}
  - {name: gen-bi-orchestrator, newName: registry.example.com/d2d/orchestrator, newTag: "2026.11.04"}
  - {name: gen-bi-litellm, newName: registry.example.com/d2d/litellm, newTag: "2026.11.04"}
patches:
  - target: {kind: PersistentVolumeClaim, name: "d2d-projects|d2d-library|d2d-llm"}
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: azurefile-csi          # any ReadWriteMany class: azurefile-csi, efs-sc, filestore, nfs...
  - target: {kind: Deployment, name: orchestrator}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: registry.example.com/d2d/agent:2026.11.04     # the image personal workspaces start from
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: Always

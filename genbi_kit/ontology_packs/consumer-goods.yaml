  - {name: Absolute Forecast Error, kind: measure, unit: count, aggregation: sum, description: "Forecast error with no sign (miss either way), in cases.",
     synonyms: [abs forecast error, abs error, abs fcst error, absolute error, forecast error abs, abs deviation, forecast miss]}
  - {name: Ordered Cases, kind: measure, unit: count, aggregation: sum, description: "Cases the customer ordered.",
     synonyms: [order cases, cases ordered, order qty, ordered qty, ordered quantity, customer order qty, requested cases]}
  - {name: Delivered Cases, kind: measure, unit: count, aggregation: sum, description: "Cases delivered against orders.",
     synonyms: [cases delivered, delivered qty, delivered quantity, delivery qty, fulfilled cases, confirmed cases]}
  - {name: Deliveries, kind: measure, unit: count, aggregation: sum, description: "Deliveries made to customers.",
     synonyms: [delivery count, drops, drop count, number of deliveries, shipments count]}
  - {name: OTIF Deliveries, kind: measure, unit: count, aggregation: sum, description: "Deliveries that arrived on time and in full.",
     synonyms: [otif count, on time in full deliveries, otif drops, perfect deliveries, otif qualified]}
  - {name: Inventory Value, kind: measure, unit: currency, aggregation: last, description: "Value of finished goods stock at the end of the period.",
     synonyms: [inventory cost, stock value, fg inventory value, finished goods value, inventory dollars, inventory at cost]}
  - {name: Inventory Cases, kind: measure, unit: count, aggregation: last, description: "Cases of finished goods in stock at the end of the period.",
     synonyms: [on hand cases, stock cases, fg cases, inventory qty, inventory units, closing stock cases, soh cases]}
  # ---------------- measures: prices
  - {name: List Price, kind: measure, unit: currency, aggregation: average, description: "Price list price of a case or unit charged to the customer.",
     synonyms: [wholesale price, price list, case price, list price per case, customer list price, invoice price, gross price]}
  - {name: Shelf Price, kind: measure, unit: currency, aggregation: average, description: "Price paid by the shopper at the shelf.",
     synonyms: [retail price, rsp, srp, consumer price, shelf retail, avg retail price, average shelf price, pos price]}
  - {name: Unit Cost, kind: measure, unit: currency, aggregation: average, description: "Standard cost of one unit or case.",
     synonyms: [standard cost, std cost, cost per unit, cost per case, case cost, product unit cost]}
  - {name: Buying Households, kind: measure, unit: count, aggregation: distinct_count, description: "Households that bought the brand (consumer panel).",
     synonyms: [buyer households, panel buyers, hh buyers, buyers, buying hh, purchasing households]}

  # ---------------- keys
  - {name: Product, kind: key, entity: Product, description: "Identifies an item (SKU).",
     synonyms: [product id, product key, product code, product number, sku, sku id, sku code, material, material id, material number, material code, item id, item code, item number, gtin, ean, upc, article number]}
  - {name: Customer, kind: key, entity: Customer, description: "Identifies a customer (retailer or distributor account).",
     synonyms: [customer id, customer key, customer code, customer number, sold to, sold to id, sold to party, sold to number, account id, account number, retailer id, retailer code, distributor id, customer nbr]}
  - {name: Ship To, kind: key, entity: Ship To, description: "Identifies the delivery point of an order.",

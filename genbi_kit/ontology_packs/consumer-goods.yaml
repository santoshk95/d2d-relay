# Industry pack: consumer goods (CPG and FMCG manufacturers selling through retailers). Business terms tag columns by name
# (genbi_kit/ontology.py); KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Consumer goods
order: 20
description: Manufacturers of packaged food, drinks, home and personal care sold through retailers. Shipments and net sales, retailer sell-through, distribution, trade promotion, market share, forecast accuracy and service levels.
questions:
  - What were net sales and gross margin by brand last quarter, and how do they compare with last year?
  - Which retailers have the highest trade spend as a percent of gross sales?
  - How has our market share changed by category over the last 13 weeks?
  - Which promotions delivered the best lift and return on spend this year?
  - What is the forecast accuracy by brand and planning month, and where is the forecast biased?
  - Which customers have an OTIF rate below target, and what is their case fill rate?

terms:
  # ---------------- measures: shipments and sales
  - {name: Gross Sales, kind: measure, unit: currency, aggregation: sum, description: "Invoiced sales at list price before trade deductions.",
     synonyms: [gross sls, gross revenue, gross invoice sales, gross invoiced sales, gsv, gross sales value, invoice gross]}
  - {name: Net Sales, kind: measure, unit: currency, aggregation: sum, description: "Sales after trade spend, returns and damages (net sales value).",
     synonyms: [net sls, net revenue, nsv, net sales value, net invoice sales, net turnover, net net sales, sales net]}
  - {name: Sales, kind: measure, unit: currency, aggregation: sum, description: "Value of goods shipped to customers.",
     synonyms: [sls, sale, sales amount, revenue, turnover, shipment sales, shipment value, invoiced sales, billing amount, billed sales, invoice amount]}
  - {name: Shipment Cases, kind: measure, unit: count, aggregation: sum, description: "Cases shipped to customers.",
     synonyms: [ship cases, cases shipped, shipped cases, shipment volume, shipments cases, billed cases, invoiced cases, case shipments, shipped qty cases]}
  - {name: Shipment Units, kind: measure, unit: count, aggregation: sum, description: "Consumer units shipped to customers.",
     synonyms: [ship units, units shipped, shipped units, shipment qty, shipped quantity, billed units, invoiced units, shipped eaches]}
  - {name: Equivalized Volume, kind: measure, unit: number, aggregation: sum, description: "Volume restated to a standard unit (equivalized cases, kilograms or litres) so products can be added up.",
     synonyms: [eq volume, equivalised volume, eq cases, standard cases, std cases, std units, standard units, equivalent units, volume kg, volume litres]}
  - {name: Cost of Goods Sold, kind: measure, unit: currency, aggregation: sum, description: "Standard cost of the goods shipped.",
     synonyms: [cogs, cost of sales, std cost total, standard cost amount, cost of goods, product cost]}
  - {name: Gross Margin, kind: measure, unit: currency, aggregation: sum, description: "Net sales less the cost of goods sold.",
     synonyms: [gross profit, gm dollars, margin dollars, gross margin amount, gp amount, gross margin value]}
  - {name: Gross Margin %, kind: measure, unit: percent, aggregation: average, description: "Gross margin as a share of net sales, already worked out per row (weight it by net sales, never average it).",
     synonyms: [gross margin pct, gm pct, gm percent, margin pct, gross margin rate, gm rate]}
  # ---------------- measures: trade spend and promotion
  - {name: Trade Spend, kind: measure, unit: currency, aggregation: sum, description: "Money given to retailers to sell the product - off-invoice, bill-back, scan and display allowances.",
     synonyms: [trade spending, trade promotion spend, trade promo spend, tpm spend, trade investment, promo spend, promotion spend, trade funds, trade deductions, tpr spend, trade cost]}
  - {name: Off Invoice Allowance, kind: measure, unit: currency, aggregation: sum, description: "Discount taken straight off the invoice.",
     synonyms: [off invoice, oi allowance, off invoice discount, oi discount, invoice discount, oi amount]}
  - {name: Bill Back Allowance, kind: measure, unit: currency, aggregation: sum, description: "Allowance paid to the retailer after the sale, against proof of performance.",
     synonyms: [bill back, billback, bb allowance, scan allowance, scan back, scanback, accrual amount, deduction amount, claim payment]}
  - {name: Returns and Damages, kind: measure, unit: currency, aggregation: sum, description: "Value of goods returned, damaged or unsaleable.",
     synonyms: [returns, damages, unsaleables, unsaleable, damaged goods, returned goods, returns value, spoilage returns, swell allowance]}
  - {name: Marketing Spend, kind: measure, unit: currency, aggregation: sum, description: "Consumer advertising and marketing spend.",
     synonyms: [advertising spend, ad spend, a and p spend, media spend, consumer spend, brand spend, marketing cost, marketing investment]}
  - {name: Baseline Units, kind: measure, unit: count, aggregation: sum, description: "Units that would have sold without the promotion.",
     synonyms: [base units, baseline volume, base volume, baseline qty, non promo units]}
  - {name: Incremental Units, kind: measure, unit: count, aggregation: sum, description: "Extra units sold because of the promotion.",
     synonyms: [incremental volume, incr units, incr volume, uplift units, lift units, promo uplift]}
  - {name: Promo Units, kind: measure, unit: count, aggregation: sum, description: "Units sold while on promotion.",
     synonyms: [promoted units, promo volume, units on promo, promo qty, promo eaches]}
  - {name: Promo Lift %, kind: measure, unit: percent, aggregation: average, description: "Extra volume of a promotion over baseline, worked out per row.",
     synonyms: [lift pct, promo lift pct, uplift pct, lift percent, promo uplift pct, incremental pct]}
  - {name: Promo Events, kind: measure, unit: count, aggregation: sum, description: "Promotion events run.",
     synonyms: [number of promos, promo count, event count, events run, tactic count]}
  # ---------------- measures: retailer sell-through, market and distribution
  - {name: POS Sales, kind: measure, unit: currency, aggregation: sum, description: "Retailer point-of-sale sales dollars to consumers (sell-through, sell-out).",
     synonyms: [pos sls, pos dollars, pos revenue, sell through sales, sell out sales, consumption sales, retail sales value, rsv, scan sales, epos sales, retailer sales, retailer pos sales]}
  - {name: POS Units, kind: measure, unit: count, aggregation: sum, description: "Retailer point-of-sale units sold to consumers.",
     synonyms: [pos qty, pos volume, sell through units, sell out units, consumption units, scan units, epos units, retailer units]}
  - {name: Category Sales, kind: measure, unit: currency, aggregation: sum, description: "Sales of the whole category (all brands) in the market, the base for market share.",
     synonyms: [market sales, total market sales, category dollars, category sales dollars, market dollars, total category sales, category value]}
  - {name: Market Share %, kind: measure, unit: percent, aggregation: average, description: "Share of category sales, already worked out per row (never add or average it up).",
     synonyms: [market share pct, mkt share pct, mkt share, dollar share pct, value share pct, share of market, share pct, volume share pct]}
  - {name: Weighted Distribution %, kind: measure, unit: percent, aggregation: average, description: "Share of category sales in stores that carry the product (ACV weighted distribution).",
     synonyms: [weighted distribution, acv distribution, acv weighted distribution, acv pct, wtd distribution, wd pct, wd, tdp weighted]}
  - {name: Numeric Distribution %, kind: measure, unit: percent, aggregation: average, description: "Share of stores that carry the product.",
     synonyms: [numeric distribution, nd pct, nd, numeric dist pct, store distribution pct]}
  - {name: Stores Selling, kind: measure, unit: count, aggregation: average, description: "Stores that sold the product in the period.",
     synonyms: [stores carrying, stores with sales, selling stores, store count selling, points of distribution, distribution points]}
  - {name: Retailer On Hand Units, kind: measure, unit: count, aggregation: last, description: "Units in stock at the retailer at the end of the period.",
     synonyms: [retailer inventory, retailer oh, retailer on hand, store on hand units, retailer stock units, store inventory units, customer inventory]}
  - {name: Out of Stock Stores, kind: measure, unit: count, aggregation: sum, description: "Stores found out of stock of the product.",
     synonyms: [oos stores, stores out of stock, stores oos, oos count, stockout stores]}
  # ---------------- measures: forecast, orders and service
  - {name: Forecast Cases, kind: measure, unit: count, aggregation: sum, description: "Forecast demand in cases.",
     synonyms: [statistical forecast, stat forecast, consensus forecast, demand forecast, forecast qty, forecast volume, fcst cases, fcst qty, forecast units]}
  - {name: Actual Demand Cases, kind: measure, unit: count, aggregation: sum, description: "Actual demand in cases, to compare with the forecast.",

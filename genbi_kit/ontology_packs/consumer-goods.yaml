  - {name: Order, kind: key, entity: Order, description: "Identifies a customer order.",
     synonyms: [order id, order number, order key, sales order, sales order number, so number, customer po, po number, order nbr]}
  - {name: Invoice, kind: key, entity: Invoice, description: "Identifies an invoice.",
     synonyms: [invoice id, invoice number, invoice key, billing document, billing doc, bill number, billing number]}
  - {name: Promotion, kind: key, entity: Promotion, description: "Identifies a trade promotion event.",
     synonyms: [promo id, promotion id, promo number, promo code, event id, tactic id, deal id, offer id, trade plan id, funding id]}
  - {name: Sales Rep, kind: key, entity: Sales Rep, description: "Identifies a sales representative or key account manager.",
     synonyms: [sales rep id, salesperson id, rep id, kam id, account manager id, salesman id, sales force id]}

  # ---------------- dates
  - {name: Date, kind: date, entity: Date, description: "The day a row belongs to.",
     synonyms: [day, ship date, shipment date, invoice date, billing date, order date, transaction date, posting date, calendar date, delivery date, pos date, sales date]}
  - {name: Week Ending Date, kind: date, entity: Date, description: "The last day of the sales week, as retailer POS data reports it.",

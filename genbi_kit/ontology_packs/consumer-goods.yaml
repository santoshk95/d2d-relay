  - {name: Fiscal Week, kind: date, entity: Date, synonyms: [fiscal wk, fw, fiscal week number, week number, week id, retail week]}
  - {name: Fiscal Period, kind: date, entity: Date, synonyms: [fiscal month, period number, period id, fiscal period number, accounting period, posting period, fp]}
  - {name: Fiscal Quarter, kind: date, entity: Date, synonyms: [fiscal qtr, fq, quarter number, quarter id]}
  - {name: Fiscal Year, kind: date, entity: Date, synonyms: [fiscal yr, fy, fiscal year number, year number]}
  - {name: Promo Start Date, kind: date, entity: Date, description: "First day of a promotion.",
     synonyms: [promotion start date, event start date, promo start, start date, in store start date, offer start date]}
  - {name: Promo End Date, kind: date, entity: Date, description: "Last day of a promotion.",
     synonyms: [promotion end date, event end date, promo end, end date, in store end date, offer end date]}

  # ---------------- attributes: product hierarchy
  - {name: Product Name, kind: attribute, entity: Product, synonyms: [sku name, sku description, item name, item description, material description, material name, product description, description]}
  - {name: Brand, kind: attribute, entity: Product, description: "The consumer brand.",
     synonyms: [brand name, brand description, brand desc, brand code, power brand, megabrand]}
  - {name: Sub Brand, kind: attribute, entity: Product, synonyms: [subbrand, sub brand name, variant, line extension, product line, brand variant]}
  - {name: Category, kind: attribute, entity: Product, description: "The product category the brand competes in.",
     synonyms: [category name, product category, category description, cat name, market category, business category]}
  - {name: Subcategory, kind: attribute, entity: Product, synonyms: [sub category, subcategory name, sub cat, segment, segment name, product segment, sector]}
  - {name: Pack Size, kind: attribute, entity: Product, synonyms: [size, pack, pack description, size description, net content, content size, uom, unit of measure, package size, pack type]}
  - {name: Flavor, kind: attribute, entity: Product, synonyms: [flavour, scent, variant name, taste, fragrance, shade]}
  - {name: Item Status, kind: attribute, entity: Product, synonyms: [product status, sku status, lifecycle status, lifecycle stage, active flag, material status]}
  # ---------------- attributes: customer, geography, channel, promotion
  - {name: Customer Name, kind: attribute, entity: Customer, synonyms: [account name, retailer name, sold to name, customer description, customer desc, distributor name, retailer]}
  - {name: Customer Group, kind: attribute, entity: Customer, description: "The key account or retail group a customer belongs to.",
     synonyms: [key account, key account group, account group, customer hierarchy, retail group, parent customer, customer chain, chain name, trade group]}
  - {name: Channel, kind: attribute, entity: Customer, description: "The route to market (modern trade, general trade, e-commerce).",
     synonyms: [sales channel, distribution channel, channel name, trade channel, route to market, rtm, customer channel, retail channel]}
  - {name: Region, kind: attribute, entity: Customer, synonyms: [region name, sales region, sales area, area, zone, territory, market]}
  - {name: Country, kind: attribute, entity: Customer, synonyms: [country name, country code, nation, market country]}
  - {name: State, kind: attribute, entity: Customer, synonyms: [state name, state code, province, st]}
  - {name: City, kind: attribute, entity: Customer, synonyms: [city name, town, ship to city]}
  - {name: Plant Name, kind: attribute, entity: Plant, synonyms: [plant description, factory name, site name, manufacturing site name]}
  - {name: Promo Type, kind: attribute, entity: Promotion, description: "The kind of promotion mechanic (temporary price reduction, display, feature, bundle).",
     synonyms: [promotion type, tactic, tactic type, promo mechanic, mechanic, offer type, deal type, event type, promo tactic]}
  - {name: Promotion Name, kind: attribute, entity: Promotion, synonyms: [promo name, event name, promo description, event description, campaign name, offer name]}
  - {name: Promo Flag, kind: attribute, entity: Promotion, description: "Whether the row was sold on promotion.",
     synonyms: [on promo, promo, promo indicator, promotion flag, promoted flag, deal flag, promo ind]}

kpis:
  # ---------------- sales and margin
  - name: Gross Sales
    synonyms: [Gross Sales Value, GSV, Gross Revenue]
    definition: Invoiced sales at list price before trade deductions, returns and damages.
    formula: Sum of shipped quantity times list price
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Trade Spend
    synonyms: [Trade Promotion Spend, Trade Investment, Trade Spending]
    definition: Money given to retailers to sell the product - off-invoice discounts, bill-backs, scan and display allowances, listing fees.
    formula: Off-invoice allowances + bill-back and scan allowances + other customer funding
    unit: currency
    aggregation: sum
    domain: Trade
  - name: Returns and Damages
    synonyms: [Returns, Unsaleables, Damages]
    definition: Value of goods returned, damaged or unsaleable at customers, credited to them.
    formula: Sum of credits for returns, damages and unsaleables
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Net Sales
    synonyms: [Net Sales Value, NSV, Net Revenue]
    definition: Gross sales less trade spend, returns and damages - what the company keeps from its customers.
    formula: Gross sales - Trade spend - Returns and damages
    dax: '[Gross Sales] - [Trade Spend] - [Returns and Damages]'
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Trade Spend %
    synonyms: [Trade Rate, Trade Spend % of Gross Sales, Trade Investment %]
    definition: Trade spend as a share of gross sales.
    formula: Trade spend / Gross sales
    dax: DIVIDE ( [Trade Spend], [Gross Sales] )
    unit: percent
    aggregation: ratio
    domain: Trade
  - name: Net Sales LY
    synonyms: [Net Sales Last Year, NSV LY]
    definition: Net sales in the same period last year.
    formula: Net sales for the same fiscal period one year earlier
    unit: currency
    aggregation: sum
    time: fiscal year, same fiscal weeks last year
    domain: Sales
  - name: Net Sales Growth %
    synonyms: [NSV Growth %, Net Sales vs LY %, YoY Net Sales Growth]
    definition: Change in net sales against the same period last year.
    formula: (Net sales - Net sales last year) / Net sales last year
    dax: DIVIDE ( [Net Sales] - [Net Sales LY], [Net Sales LY] )
    unit: percent
    aggregation: ratio
    domain: Sales
  - name: Shipment Cases
    synonyms: [Cases Shipped, Shipment Volume, Volume Shipped]
    definition: Cases shipped to customers, net of returns.
    formula: Sum of cases shipped - cases returned
    unit: count
    aggregation: sum
    domain: Sales
  - name: Net Sales per Case
    synonyms: [Net Price per Case, Realized Price per Case, Net Revenue per Case]
    definition: Net sales per case shipped (the price actually realized after trade).
    formula: Net sales / Shipment cases
    dax: DIVIDE ( [Net Sales], [Shipment Cases] )
    unit: currency
    aggregation: ratio
    domain: Sales
  - name: Cost of Goods Sold
    synonyms: [COGS, Cost of Sales]
    definition: Standard cost of the goods shipped, including manufacturing and inbound freight.
    formula: Sum of shipped quantity times standard unit cost
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Gross Margin
    synonyms: [Gross Profit, Gross Margin $, GM $]
    definition: Net sales less the cost of goods sold.
    formula: Net sales - Cost of goods sold
    dax: '[Net Sales] - [Cost of Goods Sold]'
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Gross Margin %
    synonyms: [GM %, Gross Margin Rate, Gross Profit %]
    definition: Gross margin as a share of net sales.
    formula: Gross margin / Net sales
    dax: DIVIDE ( [Gross Margin], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Margin
  # ---------------- sell-through, market share and distribution
  - name: POS Sales
    synonyms: [Retail Sales Value, RSV, Sell-Through Sales, Sell-Out Sales, Consumption Sales]
    definition: Dollar sales to consumers at the retailers' registers, from retailer or syndicated point-of-sale data.
    formula: Sum of retailer point-of-sale sales
    unit: currency
    aggregation: sum
    domain: Sell-Through
  - name: POS Units
    synonyms: [Sell-Through Units, Consumption Units, Scan Units]
    definition: Units sold to consumers at the retailers' registers.
    formula: Sum of retailer point-of-sale units
    unit: count
    aggregation: sum
    domain: Sell-Through
  - name: POS Sales LY
    synonyms: [POS Sales Last Year, RSV LY]
    definition: Point-of-sale sales in the same period last year.
    formula: POS sales for the same weeks one year earlier
    unit: currency
    aggregation: sum
    time: same retail weeks last year
    domain: Sell-Through
  - name: POS Sales Growth %
    synonyms: [POS Growth %, Consumption Growth %, RSV Growth %, POS vs LY %]
    definition: Change in point-of-sale sales against the same period last year.
    formula: (POS sales - POS sales last year) / POS sales last year
    dax: DIVIDE ( [POS Sales] - [POS Sales LY], [POS Sales LY] )
    unit: percent
    aggregation: ratio
    domain: Sell-Through
  - name: Category Sales
    synonyms: [Market Sales, Total Market Sales, Category Value]
    definition: Point-of-sale sales of the whole category in the same markets and retailers (all brands).
    formula: Sum of point-of-sale sales of every brand in the category
    unit: currency
    aggregation: sum
    domain: Market Share
  - name: Market Share %
    synonyms: [Value Share, Dollar Share, Share of Market, Market Share]
    definition: The brand's share of category point-of-sale sales in the same markets.
    formula: POS sales / Category sales
    dax: DIVIDE ( [POS Sales], [Category Sales] )
    unit: percent
    aggregation: ratio
    domain: Market Share
  - name: Weighted Distribution %
    synonyms: [ACV Distribution, ACV Weighted Distribution, Weighted Distribution, ACV %]
    definition: Share of category sales volume (ACV) sold in stores that carry the product.
    formula: Category sales of the stores selling the product / Category sales of all stores in the universe
    unit: percent
    aggregation: custom
    domain: Distribution
  - name: Numeric Distribution %
    synonyms: [Numeric Distribution, Store Distribution %]
    definition: Share of all stores in the universe that carry the product.
    formula: Stores selling the product / Stores in the universe
    unit: percent
    aggregation: custom
    domain: Distribution
  - name: Sales Velocity
    synonyms: [Sales per Point of Distribution, SPPD, Rate of Sale, Velocity]
    definition: Point-of-sale sales per point of weighted distribution - how fast the product sells where it is stocked.
    formula: POS sales / Weighted distribution %
    dax: DIVIDE ( [POS Sales], [Weighted Distribution %] )
    unit: currency
    aggregation: ratio
    domain: Distribution
  - name: Retailer Out of Stock %
    synonyms: [OOS %, Out of Stock Rate, Store OOS %]
    definition: Share of store checks where the product was out of stock.
    formula: Store checks with the product out of stock / All store checks
    unit: percent
    aggregation: ratio
    domain: Distribution
  # ---------------- promotion
  - name: Baseline Units
    synonyms: [Baseline Volume, Base Units]
    definition: Units that would have sold in the promotion weeks without the promotion (from the baseline model).
    formula: Sum of modelled baseline units
    unit: count
    aggregation: sum
    domain: Promotion
  - name: Promoted Units
    synonyms: [Promo Units, Promo Volume]
    definition: Units actually sold in the weeks a promotion ran.
    formula: Sum of units sold in promotion weeks
    filters: [Promo flag = Yes]
    unit: count
    aggregation: sum
    domain: Promotion
  - name: Incremental Units
    synonyms: [Incremental Volume, Promo Uplift Units]
    definition: Extra units sold because of the promotion.
    formula: Promoted units - Baseline units
    dax: '[Promoted Units] - [Baseline Units]'
    unit: count
    aggregation: sum
    domain: Promotion
  - name: Promo Lift %
    synonyms: [Promotion Lift, Promo Uplift %, Lift %]
    definition: Extra volume of a promotion as a share of baseline volume.
    formula: Incremental units / Baseline units
    dax: DIVIDE ( [Incremental Units], [Baseline Units] )
    unit: percent
    aggregation: ratio
    domain: Promotion
  - name: Trade Promotion ROI
    synonyms: [Promo ROI, TPM ROI, Promotion ROI]
    definition: Return on the money spent on promotions - incremental gross profit after paying for the promotion.
    formula: (Incremental gross profit - Promotion spend) / Promotion spend
    unit: ratio
    aggregation: custom
    domain: Promotion
  # ---------------- forecast and service
  - name: Forecast Cases
    synonyms: [Forecast Volume, Demand Forecast, Consensus Forecast]
    definition: Forecast demand in cases, taken at the planning lag the business measures against.
    formula: Sum of forecast cases at the measured lag
    unit: count
    aggregation: sum
    time: measured at a fixed lag (for example 2 months before the demand month)
    domain: Planning
  - name: Actual Demand Cases
    synonyms: [Actual Demand, Actual Volume]
    definition: Actual demand in cases (orders or shipments, as the company plans against) for the same item, customer and period as the forecast.
    formula: Sum of actual demand cases
    unit: count
    aggregation: sum
    domain: Planning
  - name: Absolute Forecast Error
    synonyms: [Absolute Error, Abs Forecast Error]
    definition: Sum of forecast misses with no sign, at the item and customer level, in cases.
    formula: Sum of |Forecast cases - Actual demand cases| at item and customer level
    unit: count
    aggregation: sum
    domain: Planning
  - name: Forecast Accuracy %
    synonyms: [FA %, Forecast Accuracy, 1 - WAPE]
    definition: One minus the weighted absolute percentage error - how close the forecast is, at the item and customer level.
    formula: 1 - Absolute forecast error / Actual demand cases
    dax: 1 - DIVIDE ( [Absolute Forecast Error], [Actual Demand Cases] )
    unit: percent
    aggregation: ratio
    domain: Planning
  - name: Forecast Bias %
    synonyms: [Bias %, Forecast Bias]
    definition: Whether the forecast runs high (positive) or low (negative) overall.
    formula: (Forecast cases - Actual demand cases) / Actual demand cases
    dax: DIVIDE ( [Forecast Cases] - [Actual Demand Cases], [Actual Demand Cases] )
    unit: percent
    aggregation: ratio
    domain: Planning
  - name: Ordered Cases
    synonyms: [Cases Ordered, Order Quantity]
    definition: Cases the customers ordered (the quantity they asked for on the requested date).
    formula: Sum of ordered cases
    unit: count
    aggregation: sum
    domain: Service
  - name: Delivered Cases
    synonyms: [Cases Delivered, Fulfilled Cases]
    definition: Cases delivered against the orders.
    formula: Sum of delivered cases
    unit: count
    aggregation: sum
    domain: Service
  - name: Case Fill Rate %
    synonyms: [Case Fill Rate, Fill Rate %, Order Fill Rate]
    definition: Share of ordered cases that were delivered.
    formula: Delivered cases / Ordered cases
    dax: DIVIDE ( [Delivered Cases], [Ordered Cases] )
    unit: percent
    aggregation: ratio
    domain: Service
  - name: OTIF %
    synonyms: [On-Time In-Full %, On Time In Full, OTIF Rate]
    definition: Share of deliveries that arrived within the agreed window and with the full ordered quantity.
    formula: Deliveries on time and in full / All deliveries
    unit: percent
    aggregation: ratio
    domain: Service
  # ---------------- inventory
  - name: Inventory Value
    synonyms: [Finished Goods Inventory, FG Inventory Value]
    definition: Value of finished goods stock at the end of the period, at standard cost.
    formula: Stock on hand times standard cost, at period end
    unit: currency
    aggregation: last
    domain: Inventory
  - name: Days of Inventory
    synonyms: [DOI, Days Inventory on Hand, Days of Supply]
    definition: How many days of sales the stock covers.
    formula: Inventory value / Cost of goods sold x Days in the period
    unit: duration
    aggregation: custom
    domain: Inventory

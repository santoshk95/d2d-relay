kpis:
  # ---------------- rooms performance
  - name: Rooms Available
    synonyms: [Room Nights Available, Available Room Nights, Room Inventory]
    definition: Room nights the hotel could sell - rooms in inventory times nights, with rooms out of order for renovation taken out.
    formula: Sum over nights of sellable rooms
    unit: count
    aggregation: sum
    domain: Rooms
  - name: Rooms Sold
    synonyms: [Room Nights Sold, Occupied Rooms, Paid Room Nights]
    definition: Room nights sold to paying guests, complimentary and house-use rooms not counted.
    formula: Count of paid room nights
    unit: count
    aggregation: sum
    domain: Rooms
  - name: Occupancy %
    synonyms: [Occupancy Rate, Occupancy, Occ %]
    definition: Share of available rooms that were sold.
    formula: Rooms sold / Rooms available
    dax: DIVIDE ( [Rooms Sold], [Rooms Available] )
    unit: percent
    aggregation: ratio
    domain: Rooms
  - name: Room Revenue
    synonyms: [Rooms Revenue, Lodging Revenue, Room Sales]
    definition: Revenue from room sales, net of taxes and service charges, no-show and cancellation fees included.
    formula: Sum of room charges
    unit: currency
    aggregation: sum
    domain: Rooms
  - name: ADR
    synonyms: [Average Daily Rate, Average Room Rate]
    definition: Room revenue earned per room sold.
    formula: Room revenue / Rooms sold
    dax: DIVIDE ( [Room Revenue], [Rooms Sold] )
    unit: currency
    aggregation: ratio
    domain: Rooms
  - name: RevPAR
    synonyms: [Revenue per Available Room, Rev PAR]
    definition: Room revenue per available room - ADR times occupancy.
    formula: Room revenue / Rooms available
    dax: DIVIDE ( [Room Revenue], [Rooms Available] )
    unit: currency
    aggregation: ratio
    domain: Rooms
  - name: Food and Beverage Revenue
    synonyms: [F&B Revenue, FB Revenue, Food and Beverage Sales]
    definition: Hotel revenue from restaurants, bars, banquets and room service.
    formula: Sum of food and beverage outlet revenue
    unit: currency
    aggregation: sum
    domain: Revenue
  - name: Other Revenue
    synonyms: [Other Operated Revenue, Ancillary Revenue]
    definition: Hotel revenue from spa, parking, meeting rooms, retail and other services.
    formula: Sum of revenue from other operated departments
    unit: currency
    aggregation: sum
    domain: Revenue
  - name: Total Revenue
    synonyms: [Total Hotel Revenue, Total Property Revenue]
    definition: All revenue of the property.
    formula: Room revenue + Food and beverage revenue + Other revenue
    dax: '[Room Revenue] + [Food and Beverage Revenue] + [Other Revenue]'
    unit: currency
    aggregation: sum
    domain: Revenue
  - name: TRevPAR
    definition: Total revenue per available room.
    formula: Total revenue / Rooms available
    dax: DIVIDE ( [Total Revenue], [Rooms Available] )
    unit: currency
    aggregation: ratio
    domain: Revenue
  - name: Gross Operating Profit
    synonyms: [GOP, Gross Operating Income, House Profit]
    definition: Total revenue less departmental and undistributed operating expenses, before management fees, property taxes, insurance and fixed charges.
    formula: Total revenue - Departmental expenses - Undistributed operating expenses
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: GOP Margin %
    synonyms: [GOP %, Gross Operating Profit Margin, GOP Flow-Through]
    definition: Gross operating profit as a share of total revenue.
    formula: Gross operating profit / Total revenue
    dax: DIVIDE ( [Gross Operating Profit], [Total Revenue] )
    unit: percent
    aggregation: ratio
    domain: Profitability
  - name: GOPPAR
    synonyms: [Gross Operating Profit per Available Room]
    definition: Gross operating profit per available room.
    formula: Gross operating profit / Rooms available
    dax: DIVIDE ( [Gross Operating Profit], [Rooms Available] )
    unit: currency
    aggregation: ratio
    domain: Profitability
  # ---------------- bookings and channels
  - name: Reservations
    synonyms: [Bookings, Reservations Made, Booking Count]
    definition: Bookings made in the period (by booking date), each reservation counted once however many nights.
    formula: Count of distinct reservations by booking date
    unit: count
    aggregation: distinct_count
    time: by booking date
    domain: Bookings
  - name: Cancellations
    synonyms: [Cancelled Bookings, Cancelled Reservations]
    definition: Bookings cancelled before arrival.
    formula: Count of reservations with status = Cancelled
    unit: count
    aggregation: distinct_count
    domain: Bookings
  - name: Cancellation Rate %
    synonyms: [Cancellation %, Cancel Rate]
    definition: Share of bookings that were cancelled.
    formula: Cancellations / Reservations
    dax: DIVIDE ( [Cancellations], [Reservations] )
    unit: percent
    aggregation: ratio
    domain: Bookings
  - name: No Shows
    synonyms: [No Show Count, Guest No Shows]
    definition: Bookings where the guest did not arrive and did not cancel.
    formula: Count of reservations with status = No show
    unit: count
    aggregation: distinct_count
    domain: Bookings
  - name: No Show Rate %
    synonyms: [No-Show %, No Show %]
    definition: Share of bookings that were no shows.
    formula: No shows / Reservations
    dax: DIVIDE ( [No Shows], [Reservations] )
    unit: percent
    aggregation: ratio
    domain: Bookings
  - name: Arrivals
    synonyms: [Check-Ins, Stays, Number of Stays]
    definition: Guest stays that began in the period.
    formula: Count of reservations with an arrival date in the period
    unit: count
    aggregation: distinct_count
    time: by arrival date
    domain: Bookings
  - name: Average Length of Stay
    synonyms: [ALOS, Average LOS, Average Nights per Stay]
    definition: Average nights per stay.
    formula: Rooms sold / Arrivals
    dax: DIVIDE ( [Rooms Sold], [Arrivals] )
    unit: duration
    aggregation: ratio
    domain: Bookings
  - name: Average Booking Lead Time
    synonyms: [Booking Lead Time, Booking Window, Lead Days]
    definition: Average days between booking and arrival.
    formula: Average of (arrival date - booking date) in days
    unit: duration
    aggregation: average
    domain: Bookings
  - name: Direct Bookings
    synonyms: [Direct Reservations, Website Bookings]
    definition: Bookings made straight with the hotel - own website, app, phone, email and walk-in.
    formula: Count of reservations with a direct channel
    filters: [Booking channel in Direct, Website, App, Phone, Walk-in]
    unit: count
    aggregation: distinct_count
    domain: Distribution
  - name: Direct Booking Share %
    synonyms: [Direct Share, Direct Mix %, Direct Channel Share]
    definition: Share of bookings made directly.
    formula: Direct bookings / Reservations
    dax: DIVIDE ( [Direct Bookings], [Reservations] )
    unit: percent
    aggregation: ratio
    domain: Distribution
  - name: Booking Commission
    synonyms: [OTA Commission, Channel Commission, Distribution Cost]
    definition: Commission and fees paid to online travel agencies, GDS and other channels.
    formula: Sum of commissions on commissionable bookings
    unit: currency
    aggregation: sum
    domain: Distribution
  - name: Distribution Cost %
    synonyms: [Commission % of Room Revenue, Cost of Distribution %, Channel Cost %]
    definition: Booking commission as a share of room revenue.
    formula: Booking commission / Room revenue
    dax: DIVIDE ( [Booking Commission], [Room Revenue] )
    unit: percent
    aggregation: ratio
    domain: Distribution
  - name: Guest Satisfaction Score
    synonyms: [Review Score, Guest Rating, Guest Score]
    definition: Average guest review or survey score on the platform's scale.
    formula: Average of review scores
    unit: number
    aggregation: average
    domain: Guest
  # ---------------- restaurants
  - name: Restaurant Sales
    synonyms: [Net Sales, Outlet Sales, Restaurant Net Sales]
    definition: Sales of a restaurant or outlet after discounts and comps, taxes and tips excluded.
    formula: Gross sales - Discounts and comps
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Covers
    synonyms: [Guests Served, Cover Count, Diners]
    definition: Guests served (each person who ate or drank counts once per visit).
    formula: Sum of guests on checks
    unit: count
    aggregation: sum
    domain: Sales
  - name: Checks
    synonyms: [Check Count, Tickets, Orders, Transactions]
    definition: Bills issued to guests, split checks counted as one when from the same table.
    formula: Count of distinct checks
    unit: count
    aggregation: distinct_count
    domain: Sales
  - name: Average Check
    synonyms: [Average Check Value, Average Ticket, Average Bill]
    definition: Restaurant sales per check.
    formula: Restaurant sales / Checks
    dax: DIVIDE ( [Restaurant Sales], [Checks] )
    unit: currency
    aggregation: ratio
    domain: Sales
  - name: Spend per Cover
    synonyms: [Average Spend per Guest, Per Head Spend, Average Cover Spend]
    definition: Restaurant sales per cover.
    formula: Restaurant sales / Covers
    dax: DIVIDE ( [Restaurant Sales], [Covers] )
    unit: currency
    aggregation: ratio
    domain: Sales
  - name: Seats
    synonyms: [Seat Count, Seating Capacity]
    definition: Seats available to guests, average over the period.
    formula: Average of seats in service
    unit: count
    aggregation: average
    domain: Sales
  - name: Seat Turnover
    synonyms: [Seat Turns, Table Turns, Covers per Seat]
    definition: How many times each seat is used - covers per seat, for the period measured (usually per service or per day).
    formula: Covers / Seats
    dax: DIVIDE ( [Covers], [Seats] )
    unit: ratio
    aggregation: ratio
    domain: Sales
  - name: Food Sales
    synonyms: [Food Revenue, Kitchen Sales]
    definition: Sales of food.
    formula: Sum of food category sales
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Food Cost
    synonyms: [Food COGS, Cost of Food Sold, Food Usage]
    definition: Cost of the food used - opening stock plus purchases less closing stock.
    formula: Opening food stock + Food purchases - Closing food stock
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Food Cost %
    synonyms: [Food Cost Percentage, Food COGS %, Cost of Food %]
    definition: Food cost as a share of food sales.
    formula: Food cost / Food sales
    dax: DIVIDE ( [Food Cost], [Food Sales] )
    unit: percent
    aggregation: ratio
    domain: Cost
  - name: Beverage Sales
    synonyms: [Beverage Revenue, Bar Sales, Drinks Sales]
    definition: Sales of drinks.
    formula: Sum of beverage category sales
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Beverage Cost
    synonyms: [Beverage COGS, Cost of Beverage, Pour Cost]
    definition: Cost of the drinks used - opening stock plus purchases less closing stock.
    formula: Opening beverage stock + Beverage purchases - Closing beverage stock
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Beverage Cost %
    synonyms: [Beverage Cost Percentage, Pour Cost %, Bar Cost %]
    definition: Beverage cost as a share of beverage sales.
    formula: Beverage cost / Beverage sales
    dax: DIVIDE ( [Beverage Cost], [Beverage Sales] )
    unit: percent
    aggregation: ratio
    domain: Cost
  - name: Labor Cost
    synonyms: [Labour Cost, Payroll, Staff Cost]
    definition: Wages, benefits and payroll taxes of the staff.
    formula: Sum of wages, benefits and payroll taxes
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Labor Cost %
    synonyms: [Labor % of Sales, Labour Cost %, Payroll %]
    definition: Labor cost as a share of restaurant sales.
    formula: Labor cost / Restaurant sales
    dax: DIVIDE ( [Labor Cost], [Restaurant Sales] )
    unit: percent
    aggregation: ratio
    domain: Cost
  - name: Prime Cost %
    synonyms: [Prime Cost Ratio, Prime Cost Percentage]
    definition: Food, beverage and labor cost together as a share of restaurant sales. Under 60 to 65% is the usual target.
    formula: (Food cost + Beverage cost + Labor cost) / Restaurant sales
    dax: DIVIDE ( [Food Cost] + [Beverage Cost] + [Labor Cost], [Restaurant Sales] )
    unit: percent
    aggregation: ratio
    domain: Cost
  - name: Food Waste
    synonyms: [Waste, Spoilage, Wastage]
    definition: Cost of food thrown away - spoilage, prep waste, plate waste and spills.
    formula: Sum of recorded waste at cost
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Average Ticket Time
    synonyms: [Ticket Time, Speed of Service, Average Service Time]
    definition: Average minutes from the order being taken to the food ready or served.
    formula: Average of (food ready time - order time) in minutes
    unit: duration
    aggregation: average
    domain: Operations

# Industry pack: hospitality (hotels and restaurants). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Hotels and restaurants
order: 55
description: Hotels, resorts and restaurant groups. Rooms, occupancy, ADR and RevPAR, bookings and cancellations, channel mix, covers, average check, food and beverage cost, labor and prime cost.
questions:
  - What were occupancy, ADR and RevPAR by property last month, and how do they compare with the same month last year?
  - Which booking channels bring the most room revenue, and what is the commission cost of each?
  - What is the cancellation and no-show rate by market segment and by lead time?
  - What was the average check and the covers by restaurant and by day part this week?
  - Which restaurants have food cost above 32 percent of food sales, and what is their waste?
  - How is labor cost as a percent of sales trending by outlet?


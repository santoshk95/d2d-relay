kpis:
  # ---------------- output and quality
  - name: Units Produced
    synonyms: [Total Count, Production Volume, Total Units, Production Quantity]
    definition: All units the line made in the period, good and defective.
    formula: Sum of produced quantities from production confirmations
    unit: count
    aggregation: sum
    domain: Production
  - name: Good Units
    synonyms: [Good Count, Good Quantity, Conforming Units]
    definition: Units that passed quality at the first check, with no rework.
    formula: Units produced - Scrap units - Rework units
    dax: '[Units Produced] - [Scrap Units] - [Rework Units]'
    unit: count
    aggregation: sum
    domain: Production
  - name: Scrap Units
    synonyms: [Scrap Quantity, Rejected Units, Scrapped Units]
    definition: Units thrown away as defective.
    formula: Sum of scrapped quantities
    unit: count
    aggregation: sum
    domain: Quality
  - name: Rework Units
    synonyms: [Rework Quantity, Reworked Units]
    definition: Units sent back for repair and checked again.
    formula: Sum of quantities sent to rework
    unit: count
    aggregation: sum
    domain: Quality
  - name: Scrap Rate %
    synonyms: [Scrap %, Scrap Rate, Reject Rate %]
    definition: Scrap units as a share of all units produced.
    formula: Scrap units / Units produced
    dax: DIVIDE ( [Scrap Units], [Units Produced] )
    unit: percent
    aggregation: ratio
    domain: Quality
  - name: Planned Units
    synonyms: [Planned Quantity, Production Plan, Scheduled Quantity]
    definition: Units the production schedule asked for in the period.
    formula: Sum of planned order quantities due in the period
    unit: count
    aggregation: sum
    domain: Production
  - name: Plan Attainment %
    synonyms: [Schedule Attainment, Schedule Adherence %, Production vs Plan %, Plan Adherence]
    definition: Good units as a share of the units planned.
    formula: Good units / Planned units
    dax: DIVIDE ( [Good Units], [Planned Units] )
    unit: percent
    aggregation: ratio
    domain: Production
  - name: Input Quantity
    synonyms: [Material Input, Quantity Started]
    definition: Material or units put into the process.
    formula: Sum of quantities fed into the process
    unit: number
    aggregation: sum
    domain: Yield
  - name: Output Quantity
    synonyms: [Process Output, Good Output]
    definition: Good product that came out of the process.
    formula: Sum of good quantities confirmed to stock
    unit: number
    aggregation: sum
    domain: Yield
  - name: Process Yield %
    synonyms: [Yield %, Yield, Material Yield %]
    definition: Good output as a share of input, in the same unit of measure.
    formula: Output quantity / Input quantity
    dax: DIVIDE ( [Output Quantity], [Input Quantity] )
    unit: percent
    aggregation: ratio
    domain: Yield
  - name: Units Inspected
    synonyms: [Inspected Quantity, Sample Size]
    definition: Units checked by quality control.
    formula: Sum of inspected units
    unit: count
    aggregation: sum
    domain: Quality
  - name: Defective Units
    synonyms: [Defective Quantity, Nonconforming Units]
    definition: Inspected units with at least one defect.
    formula: Count of inspected units that failed
    unit: count
    aggregation: sum
    domain: Quality
  - name: Defect Rate %
    synonyms: [Defective Rate, Reject Rate, Fraction Defective]
    definition: Defective units as a share of units inspected.
    formula: Defective units / Units inspected
    dax: DIVIDE ( [Defective Units], [Units Inspected] )
    unit: percent
    aggregation: ratio
    domain: Quality
  - name: Defects per Million Units
    synonyms: [PPM, Defective PPM, Parts per Million Defective]
    definition: Defective units for every million units inspected.
    formula: Defective units / Units inspected x 1,000,000
    dax: DIVIDE ( [Defective Units], [Units Inspected] ) * 1000000
    unit: number
    aggregation: ratio
    domain: Quality
  # ---------------- OEE and time
  - name: Planned Production Time
    synonyms: [Planned Time, Scheduled Time, Loading Time]
    definition: Minutes the line was scheduled to run - shift time less planned breaks and planned stops.
    formula: Shift minutes - Planned breaks - Planned downtime
    unit: duration
    aggregation: sum
    domain: OEE
  - name: Downtime
    synonyms: [Unplanned Downtime, Stop Time, Stoppage Time]
    definition: Minutes the line was stopped during planned production time - breakdowns, changeovers, material waits and minor stops.
    formula: Sum of stop minutes inside planned production time
    unit: duration
    aggregation: sum
    domain: OEE
  - name: Run Time
    synonyms: [Operating Time, Running Time, Uptime]
    definition: Minutes the line was running.
    formula: Planned production time - Downtime
    dax: '[Planned Production Time] - [Downtime]'
    unit: duration
    aggregation: sum
    domain: OEE
  - name: Availability %
    synonyms: [OEE Availability, Availability Rate, Machine Availability]
    definition: Share of planned production time that the line was running (the availability factor of OEE).
    formula: Run time / Planned production time
    dax: DIVIDE ( [Run Time], [Planned Production Time] )
    unit: percent
    aggregation: ratio
    domain: OEE
  - name: Downtime %
    synonyms: [Downtime Rate, Unplanned Downtime %]
    definition: Downtime as a share of planned production time.
    formula: Downtime / Planned production time
    dax: DIVIDE ( [Downtime], [Planned Production Time] )
    unit: percent
    aggregation: ratio
    domain: OEE
  - name: Ideal Run Time
    synonyms: [Standard Run Time, Ideal Production Time]
    definition: Minutes the units produced should have taken at the ideal cycle time.
    formula: Sum of units produced times ideal cycle time
    unit: duration
    aggregation: sum
    domain: OEE
  - name: Performance %
    synonyms: [OEE Performance, Performance Rate, Speed Efficiency]
    definition: Speed against the ideal rate while running (the performance factor of OEE), capped at 100%.
    formula: Ideal run time / Run time
    dax: DIVIDE ( [Ideal Run Time], [Run Time] )
    unit: percent
    aggregation: ratio
    domain: OEE
  - name: Quality %
    synonyms: [OEE Quality, Quality Rate, First Pass Yield %, FPY %, First Pass Yield]
    definition: Good units as a share of all units produced (the quality factor of OEE; first pass yield).
    formula: Good units / Units produced
    dax: DIVIDE ( [Good Units], [Units Produced] )
    unit: percent
    aggregation: ratio
    domain: OEE
  - name: OEE %
    synonyms: [OEE, Overall Equipment Effectiveness, OEE Score]
    definition: Overall equipment effectiveness - the share of planned time spent making good units at the ideal speed.
    formula: Availability x Performance x Quality
    dax: '[Availability %] * [Performance %] * [Quality %]'
    unit: percent
    aggregation: ratio
    domain: OEE
  - name: Throughput per Run Hour
    synonyms: [Units per Hour, UPH, Throughput Rate, Line Speed]
    definition: Units produced for each hour the line was running.
    formula: Units produced / Run time in hours
    dax: DIVIDE ( [Units Produced], [Run Time] ) * 60
    unit: number
    aggregation: ratio
    domain: Production
  - name: Changeover Time
    synonyms: [Changeover Minutes, Setup Time]
    definition: Minutes spent switching the line from one product to the next.
    formula: Sum of changeover minutes
    unit: duration
    aggregation: sum
    domain: OEE
  # ---------------- cost, labor, energy
  - name: Production Cost
    synonyms: [Manufacturing Cost, Cost of Production, Conversion Cost]
    definition: Material, labor and overhead cost of the units produced.
    formula: Material cost + Direct labor cost + Manufacturing overhead
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Cost per Good Unit
    synonyms: [Unit Cost, Cost per Unit, Manufacturing Cost per Unit]
    definition: Production cost for each good unit made.
    formula: Production cost / Good units
    dax: DIVIDE ( [Production Cost], [Good Units] )
    unit: currency
    aggregation: ratio
    domain: Cost
  - name: Scrap Cost
    synonyms: [Cost of Scrap, Cost of Poor Quality, Scrap Value]
    definition: Cost of the units scrapped (materials and the work already put in).
    formula: Scrapped quantity times standard cost
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Scrap Cost %
    synonyms: [Scrap Cost % of Production Cost, Cost of Scrap %]
    definition: Scrap cost as a share of production cost.
    formula: Scrap cost / Production cost
    dax: DIVIDE ( [Scrap Cost], [Production Cost] )
    unit: percent
    aggregation: ratio
    domain: Cost
  - name: Labor Hours
    synonyms: [Direct Labor Hours, Hours Worked, Man Hours]
    definition: Hours worked by production staff.
    formula: Sum of hours booked to production orders
    unit: number
    aggregation: sum
    domain: Labor
  - name: Labor Productivity
    synonyms: [Units per Labor Hour, Output per Labor Hour]
    definition: Good units made for each labor hour.
    formula: Good units / Labor hours
    dax: DIVIDE ( [Good Units], [Labor Hours] )
    unit: ratio
    aggregation: ratio
    domain: Labor
  - name: Energy Consumed
    synonyms: [Energy Consumption, Energy Use, Electricity Used]
    definition: Energy used by production, in kilowatt hours.
    formula: Sum of metered energy
    unit: number
    aggregation: sum
    domain: Energy
  - name: Energy per Good Unit
    synonyms: [Energy Intensity, Specific Energy Consumption, kWh per Unit]
    definition: Energy used for each good unit made.
    formula: Energy consumed / Good units
    dax: DIVIDE ( [Energy Consumed], [Good Units] )
    unit: ratio
    aggregation: ratio
    domain: Energy
  # ---------------- maintenance and safety
  - name: Breakdowns
    synonyms: [Failures, Equipment Failures, Breakdown Count]
    definition: Unplanned equipment failures that stopped production.
    formula: Count of corrective maintenance events that stopped the machine
    unit: count
    aggregation: sum
    domain: Maintenance
  - name: Repair Time
    synonyms: [Time to Repair, Corrective Maintenance Time]
    definition: Time spent repairing breakdowns, from the stop to the machine running again.
    formula: Sum of repair minutes of breakdowns
    unit: duration
    aggregation: sum
    domain: Maintenance
  - name: MTBF
    synonyms: [Mean Time Between Failures, Mean Time Between Breakdowns]
    definition: Average running time between two failures.
    formula: Run time / Breakdowns
    dax: DIVIDE ( [Run Time], [Breakdowns] )
    unit: duration
    aggregation: ratio
    domain: Maintenance
  - name: MTTR
    synonyms: [Mean Time to Repair, Mean Time to Restore]
    definition: Average time to repair a failure.
    formula: Repair time / Breakdowns
    dax: DIVIDE ( [Repair Time], [Breakdowns] )
    unit: duration
    aggregation: ratio
    domain: Maintenance
  - name: Maintenance Cost
    synonyms: [Maintenance Spend, Maintenance Expense, Repair Cost]
    definition: Parts, labor and contractor cost of maintenance work.

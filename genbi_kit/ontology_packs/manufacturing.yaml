# Industry pack: manufacturing (plants and production lines). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Manufacturing
order: 40
description: Plants, lines and machines. Production output, OEE with availability, performance and quality, yield, scrap, downtime, throughput, maintenance, cost per unit, labor and safety.
questions:
  - What was OEE by line last week, and which of availability, performance or quality pulled it down?
  - Which machines had the most unplanned downtime this month, and what were the top reasons?
  - What is the scrap rate by product and by shift over the last 12 weeks?
  - How does production compare with plan by plant this month?
  - What are the mean time between failures and the mean time to repair for each machine?
  - How is cost per good unit changing by product family?

terms:
  # ---------------- measures: output and quality
  - {name: Units Produced, kind: measure, unit: count, aggregation: sum, description: "All units the line made, good and bad (total count).",
     synonyms: [produced qty, production qty, production quantity, produced quantity, total count, total units, units made, production volume, output units, total produced, prod qty, parts produced, units manufactured]}
  - {name: Good Units, kind: measure, unit: count, aggregation: sum, description: "Units that passed quality first time, with no rework.",
     synonyms: [good qty, good quantity, good count, good parts, conforming units, accepted units, units ok, ok qty, first pass units, good pieces, acceptable units]}
  - {name: Scrap Units, kind: measure, unit: count, aggregation: sum, description: "Units thrown away as defective.",
     synonyms: [scrap qty, scrap quantity, scrapped units, scrap count, rejected units, rejects, reject qty, reject count, bad units, defective scrap, scrapped qty, waste units]}
  - {name: Rework Units, kind: measure, unit: count, aggregation: sum, description: "Units sent back to be repaired and checked again.",

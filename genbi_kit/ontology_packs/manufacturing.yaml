    filters: [Maintenance type = Preventive]
    unit: count
    aggregation: sum
    domain: Maintenance
  - name: PM Compliance %
    synonyms: [Preventive Maintenance Compliance, PM Schedule Compliance]
    definition: Share of due preventive maintenance jobs completed on time.

     synonyms: [plan qty, planned qty, planned quantity, scheduled qty, target units, schedule qty, order qty, target quantity, production plan units, scheduled quantity]}
  - {name: Input Quantity, kind: measure, unit: number, aggregation: sum, description: "Material put into the process (the start of the yield).",
     synonyms: [input qty, material input, raw material input, consumed qty, consumed quantity, material consumed, charged qty, input weight, feed quantity, units started, started qty]}
  - {name: Output Quantity, kind: measure, unit: number, aggregation: sum, description: "Good product that came out of the process.",

# Industry pack: energy and utilities (electricity, gas and water suppliers, distributors and generators). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Energy and utilities
order: 75
description: Electricity, gas and water utilities. Consumption and customers, billing and collections, distribution losses, outages with SAIDI and SAIFI, meters, generation and capacity, complaints.
questions:
  - What are the AT&C losses by division and feeder this month, and how have they moved over the last 12 months?
  - Which feeders have the highest SAIDI and SAIFI this quarter, and what caused the outages?
  - What is the collection efficiency by customer category and by region?
  - How much electricity was billed per customer by tariff category last month?
  - What is our renewable share of net generation by plant type, and how does it compare with last year?
  - How many smart meters have we installed, and what share of meters are read successfully each month?


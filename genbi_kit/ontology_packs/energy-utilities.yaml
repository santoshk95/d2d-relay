kpis:
  # ---------------- customers, consumption, losses
  - name: Customers Served
    synonyms: [Customers, Consumers, Active Connections, Number of Customers]
    definition: Customers with a supply connection at the end of the period, disconnected accounts not counted.
    formula: Count of distinct customer connections in service at period end
    unit: count
    aggregation: last
    domain: Customers
  - name: New Connections
    synonyms: [New Customers, Connections Given, New Services]
    definition: New supply connections given in the period.
    formula: Count of connections with a connection date in the period
    unit: count
    aggregation: sum
    time: by connection date
    domain: Customers
  - name: Energy Input
    synonyms: [Energy Purchased, Input Energy, Units Input]
    definition: Energy put into the distribution network in the period (bought from generators, received from the grid or generated), in kilowatt hours.
    formula: Sum of energy received at input points
    unit: number
    aggregation: sum
    domain: Losses
  - name: Units Billed
    synonyms: [Energy Billed, Energy Sold, Billed Units]
    definition: Energy charged to customers on bills in the period, in kilowatt hours.
    formula: Sum of billed units
    unit: number
    aggregation: sum
    domain: Billing
  - name: Billing Efficiency %
    synonyms: [Billing Efficiency, Energy Billed %]
    definition: Share of the energy input that was billed.
    formula: Units billed / Energy input
    dax: DIVIDE ( [Units Billed], [Energy Input] )
    unit: percent
    aggregation: ratio
    domain: Losses
  - name: Distribution Loss %
    synonyms: [Distribution Losses, T&D Loss %, Network Loss %]
    definition: Share of the energy input that was lost or not billed - technical losses in wires and transformers plus theft and unbilled use.
    formula: 1 - Units billed / Energy input
    dax: 1 - DIVIDE ( [Units Billed], [Energy Input] )
    unit: percent
    aggregation: ratio
    domain: Losses
  - name: Average Consumption per Customer
    synonyms: [Consumption per Customer, Units per Customer, kWh per Customer]
    definition: Units billed for each customer served.
    formula: Units billed / Customers served
    dax: DIVIDE ( [Units Billed], [Customers Served] )
    unit: number
    aggregation: ratio
    domain: Billing
  - name: Peak Demand
    synonyms: [Maximum Demand, Peak Load, Max Demand]
    definition: Highest power drawn at any moment in the period.
    formula: Maximum of the demand readings in the period
    unit: number
    aggregation: max
    domain: Demand
  # ---------------- billing and collections
  - name: Billed Amount
    synonyms: [Revenue Billed, Billing Amount, Demand Raised]
    definition: Amount charged to customers on bills in the period - energy, fixed, fuel adjustment and other charges, taxes excluded.
    formula: Sum of bill amounts
    unit: currency
    aggregation: sum
    domain: Billing
  - name: Collections
    synonyms: [Revenue Collected, Payments Received, Bill Collections]
    definition: Money received from customers in the period against bills.
    formula: Sum of payments received
    unit: currency
    aggregation: sum
    domain: Billing
  - name: Collection Efficiency %
    synonyms: [Collection Efficiency, Collection Rate, Revenue Collection %]
    definition: Share of billed amount collected in the period.
    formula: Collections / Billed amount
    dax: DIVIDE ( [Collections], [Billed Amount] )
    unit: percent
    aggregation: ratio
    domain: Billing
  - name: AT&C Loss %
    synonyms: [ATC Loss, AT&C Losses, Aggregate Technical and Commercial Loss]
    definition: Aggregate technical and commercial loss - the share of input energy for which no money was collected.
    formula: 1 - (Billing efficiency x Collection efficiency)
    dax: 1 - [Billing Efficiency %] * [Collection Efficiency %]
    unit: percent
    aggregation: ratio
    domain: Losses
  - name: Arrears
    synonyms: [Outstanding Dues, Receivables, Overdue Amount]
    definition: Unpaid bills at the end of the period.
    formula: Sum of billed amounts less payments, for bills past due
    unit: currency
    aggregation: last
    domain: Billing
  - name: Average Billing Rate
    synonyms: [Average Tariff, Revenue per Unit, Average Realization per Unit Billed]
    definition: Billed amount per unit billed.
    formula: Billed amount / Units billed
    dax: DIVIDE ( [Billed Amount], [Units Billed] )
    unit: currency
    aggregation: ratio
    domain: Billing
  # ---------------- generation
  - name: Installed Capacity
    synonyms: [Capacity, Nameplate Capacity, Generating Capacity]
    definition: Maximum power the plants can produce, in megawatts, at the end of the period.
    formula: Sum of rated capacity of units in service
    unit: number
    aggregation: last
    domain: Generation
  - name: Net Generation
    synonyms: [Net Energy Generated, Net Output, Net MWh]
    definition: Energy sent to the grid after plant own use, in megawatt hours.
    formula: Gross generation - Auxiliary consumption
    unit: number
    aggregation: sum
    domain: Generation
  - name: Capacity Factor %
    synonyms: [Plant Load Factor, PLF, Capacity Utilization Factor, CUF]
    definition: Net generation as a share of what the installed capacity could have produced running all hours of the period.
    formula: Net generation / (Installed capacity x Hours in the period)
    unit: percent
    aggregation: custom
    domain: Generation
  - name: Renewable Generation
    synonyms: [Renewable Energy, Green Generation, Clean Energy Generated]
    definition: Net generation from renewable sources - solar, wind, hydro and biomass.
    formula: Net generation where source is renewable
    filters: [Generation source in Solar, Wind, Hydro, Biomass]
    unit: number
    aggregation: sum
    domain: Generation
  - name: Renewable Share %
    synonyms: [Renewable Mix, Renewable Penetration, Share of Renewables]
    definition: Renewable generation as a share of net generation.
    formula: Renewable generation / Net generation
    dax: DIVIDE ( [Renewable Generation], [Net Generation] )
    unit: percent
    aggregation: ratio
    domain: Generation
  - name: Fuel Cost
    synonyms: [Fuel Expense, Fuel Spend, Coal and Gas Cost]
    definition: Cost of fuel burned to generate power.
    formula: Sum of fuel consumed times fuel price
    unit: currency
    aggregation: sum
    domain: Generation
  - name: Fuel Cost per MWh
    synonyms: [Fuel Cost per Unit Generated, Variable Cost per MWh]
    definition: Fuel cost for each megawatt hour of net generation.
    formula: Fuel cost / Net generation
    dax: DIVIDE ( [Fuel Cost], [Net Generation] )
    unit: currency
    aggregation: ratio
    domain: Generation
  # ---------------- reliability
  - name: Customer Interruptions
    synonyms: [Customers Interrupted, Customers Affected]
    definition: Customers who lost supply, counted once for each sustained outage (usually longer than 3 minutes).
    formula: Sum over outages of customers affected
    unit: count
    aggregation: sum
    domain: Reliability
  - name: Customer Minutes Interrupted
    synonyms: [CMI, Customer Minutes Lost]
    definition: Total minutes of lost supply summed over customers - customers affected times outage minutes for every outage.
    formula: Sum over outages of customers affected x outage minutes
    unit: duration
    aggregation: sum
    domain: Reliability
  - name: Outages
    synonyms: [Outage Count, Interruptions, Power Cuts]
    definition: Supply interruption events in the period.
    formula: Count of distinct outage events
    unit: count
    aggregation: distinct_count
    domain: Reliability
  - name: SAIFI
    synonyms: [System Average Interruption Frequency Index, Interruption Frequency]
    definition: How many interruptions the average customer had in the period.
    formula: Customer interruptions / Customers served
    dax: DIVIDE ( [Customer Interruptions], [Customers Served] )
    unit: ratio
    aggregation: ratio
    domain: Reliability
  - name: SAIDI
    synonyms: [System Average Interruption Duration Index, Interruption Duration per Customer]
    definition: How many minutes of lost supply the average customer had in the period.
    formula: Customer minutes interrupted / Customers served
    dax: DIVIDE ( [Customer Minutes Interrupted], [Customers Served] )
    unit: duration
    aggregation: ratio
    domain: Reliability
  - name: CAIDI
    synonyms: [Customer Average Interruption Duration Index, Average Restoration Time]
    definition: Average minutes to restore supply to an affected customer.
    formula: Customer minutes interrupted / Customer interruptions
    dax: DIVIDE ( [Customer Minutes Interrupted], [Customer Interruptions] )
    unit: duration
    aggregation: ratio
    domain: Reliability
  # ---------------- meters, complaints, water
  - name: Meters Installed
    synonyms: [Meters in Service, Meter Count, Total Meters]
    definition: Meters in service at the end of the period.
    formula: Count of meters in service
    unit: count
    aggregation: last
    domain: Metering
  - name: Smart Meters
    synonyms: [Smart Meters Installed, AMI Meters, Smart Meter Count]
    definition: Smart meters (remotely read) in service at the end of the period.
    formula: Count of smart meters in service
    unit: count
    aggregation: last
    domain: Metering
  - name: Smart Meter Penetration %
    synonyms: [Smart Meter Share, AMI Penetration, Smart Meter Coverage]
    definition: Share of meters that are smart meters.
    formula: Smart meters / Meters installed
    dax: DIVIDE ( [Smart Meters], [Meters Installed] )
    unit: percent
    aggregation: ratio
    domain: Metering
  - name: Meters Read
    synonyms: [Successful Reads, Meter Reads, Actual Reads]
    definition: Meters read with a valid reading in the period.
    formula: Count of meters with a valid actual reading
    unit: count
    aggregation: sum
    domain: Metering
  - name: Meters Scheduled for Reading
    synonyms: [Scheduled Reads, Meters Due for Reading]
    definition: Meters due to be read in the period.
    formula: Count of meters on the reading schedule
    unit: count
    aggregation: sum
    domain: Metering
  - name: Meter Read Success %
    synonyms: [Meter Read Rate, Read Success Rate, Meter Reading Efficiency]
    definition: Share of scheduled meters read successfully.
    formula: Meters read / Meters scheduled for reading
    dax: DIVIDE ( [Meters Read], [Meters Scheduled for Reading] )
    unit: percent
    aggregation: ratio
    domain: Metering
  - name: Complaints
    synonyms: [Customer Complaints, Complaint Count, Grievances]
    definition: Customer complaints raised in the period.
    formula: Count of distinct complaints
    unit: count
    aggregation: distinct_count
    domain: Service
  - name: Complaints per 1000 Customers
    synonyms: [Complaint Rate, Complaints per Thousand Customers]
    definition: Complaints raised for every 1,000 customers served.
    formula: Complaints / Customers served x 1,000
    dax: DIVIDE ( [Complaints], [Customers Served] ) * 1000
    unit: number
    aggregation: ratio
    domain: Service
  - name: Water Supplied
    synonyms: [Water Input, System Input Volume, Water Produced]
    definition: Water put into the distribution network, in cubic metres.
    formula: Sum of metered water leaving treatment works and bulk sources
    unit: number
    aggregation: sum
    domain: Water
  - name: Water Billed
    synonyms: [Billed Water, Water Sold, Billed Volume]
    definition: Water charged to customers on bills, in cubic metres.
    formula: Sum of billed water volume
    unit: number
    aggregation: sum
    domain: Water
  - name: Non-Revenue Water %
    synonyms: [NRW, NRW %, Non Revenue Water, Water Loss %]
    definition: Share of the water supplied that earns no revenue - leaks, theft, metering errors and unbilled use.
    formula: 1 - Water billed / Water supplied
    dax: 1 - DIVIDE ( [Water Billed], [Water Supplied] )
    unit: percent
    aggregation: ratio
    domain: Water

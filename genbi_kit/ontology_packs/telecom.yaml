  - {name: Device Type, kind: attribute, entity: Device, synonyms: [handset type, device category, smartphone flag, phone type, device class, handset category, device model, handset model, device make, handset make]}
  - {name: Recharge Channel, kind: attribute, entity: Recharge, synonyms: [channel, recharge mode, recharge source, topup channel, top up channel, payment channel, payment mode, sales channel, recharge medium, wallet or retail]}
  - {name: Dealer Name, kind: attribute, entity: Dealer, synonyms: [retailer name, distributor name, agent name, outlet name, partner name, dealer description, store name]}

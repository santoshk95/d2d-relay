  - {name: ARPU, kind: measure, unit: currency, aggregation: average, description: "Average revenue per user, already worked out per row (never add it up).",
     synonyms: [arpu amount, avg revenue per user, average revenue per user, revenue per user, rpu, arpa, average revenue per account, arpu monthly, monthly arpu]}
  - {name: Recharge Value, kind: measure, unit: currency, aggregation: sum, description: "Money added to prepaid accounts.",

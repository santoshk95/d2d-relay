# Industry pack: telecom operators. Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Telecom
order: 70
description: Mobile, broadband and fixed-line operators. Subscribers and churn, ARPU, recharges and data usage, voice minutes, network availability and call quality, support tickets, billing and acquisition cost.
questions:
  - What is the monthly churn rate by plan type and by circle, and how has it moved over the last 12 months?
  - How has ARPU changed by region and subscription type this year?
  - What were gross additions and net additions by channel last month?
  - Which cell sites have network availability below 99 percent this week?
  - What is the average data usage per subscriber by plan and network technology?
  - How many recharges were made, and what is the average recharge value by channel?

terms:
  # ---------------- measures: subscribers
  - {name: Subscribers, kind: measure, unit: count, aggregation: last, description: "Active connections (SIMs, lines or broadband accounts) at the end of the period.",
     synonyms: [subscriber count, active subscribers, subs, active subs, subscriber base, total subscribers, connections, active connections, active lines, lines in service, customer base, base count, active base, closing subscribers, closing base, sim count]}
  - {name: Opening Subscribers, kind: measure, unit: count, aggregation: last, description: "Subscribers at the start of the period.",
     synonyms: [opening base, opening subs, opening subscriber count, beginning subscribers, subscribers at start, start of period subscribers, opening connections, bop subscribers]}
  - {name: Average Subscribers, kind: measure, unit: count, aggregation: average, description: "Average subscribers over the period (opening and closing, or daily).",
     synonyms: [avg subscribers, average subs, average base, avg base, mean subscribers, average active subscribers, avg subs, average connections]}
  - {name: Gross Additions, kind: measure, unit: count, aggregation: sum, description: "New connections activated in the period.",
     synonyms: [gross adds, grossadds, new connections, new subscribers, new activations, activations, new subs, acquisitions, new lines, connects, gross connects, gross activations]}
  - {name: Disconnections, kind: measure, unit: count, aggregation: sum, description: "Connections that ended in the period (churned).",
     synonyms: [disconnects, disconnect count, churned subscribers, churned subs, deactivations, terminations, churners, lost subscribers, lost subs, churn count, disconnected subscribers, line disconnects, cancellations]}
  - {name: Data Users, kind: measure, unit: count, aggregation: distinct_count, description: "Subscribers who used mobile data in the period.",
     synonyms: [data subscribers, data subs, active data users, data user count, internet users, data customers, active data subscribers, mobile data users, data active base]}
  - {name: Port Outs, kind: measure, unit: count, aggregation: sum, description: "Subscribers who moved their number to another operator.",
     synonyms: [mnp out, mnp outs, port out count, number portability out, ported out, porting out, port out requests, ported out numbers]}
  # ---------------- measures: revenue, recharges and billing
  - {name: Service Revenue, kind: measure, unit: currency, aggregation: sum, description: "Revenue from voice, data, messaging and other services (not handsets).",
     synonyms: [service rev, services revenue, telecom revenue, usage revenue, network revenue, recurring revenue, subscription revenue, mobile service revenue, airtime revenue, revenue, total revenue, gross revenue, total service revenue]}
  - {name: Data Revenue, kind: measure, unit: currency, aggregation: sum, description: "Revenue from mobile and fixed data.",
     synonyms: [data rev, internet revenue, data service revenue, mobile data revenue, broadband revenue, data usage revenue, data income]}
  - {name: Voice Revenue, kind: measure, unit: currency, aggregation: sum, description: "Revenue from calls.",

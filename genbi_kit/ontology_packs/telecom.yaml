kpis:
  # ---------------- subscribers and churn
  - name: Active Subscribers
    synonyms: [Subscribers, Subscriber Base, Active Base, Active Connections]
    definition: Connections that are active at the end of the period - for prepaid, with a billable event (call, data, recharge) in the last 90 days, for postpaid, not disconnected.
    formula: Count of distinct active connections at period end
    unit: count
    aggregation: last
    domain: Subscribers
  - name: Opening Subscribers
    synonyms: [Opening Base, Beginning Subscribers]
    definition: Active subscribers at the start of the period.
    formula: Active subscribers at the end of the previous period
    unit: count
    aggregation: last
    domain: Subscribers
  - name: Average Subscribers
    synonyms: [Average Base, Average Active Subscribers]
    definition: Average of the active subscribers over the period.
    formula: Average of daily active subscribers
    unit: count
    aggregation: average
    domain: Subscribers
  - name: Gross Additions
    synonyms: [Gross Adds, New Connections, New Activations]
    definition: New connections activated in the period.
    formula: Count of connections with an activation date in the period
    unit: count
    aggregation: sum
    time: by activation date
    domain: Subscribers
  - name: Disconnections
    synonyms: [Disconnects, Churned Subscribers, Deactivations]
    definition: Connections that ended in the period, voluntary and involuntary, port-outs included.
    formula: Count of connections with a disconnection date in the period
    unit: count
    aggregation: sum
    time: by disconnection date
    domain: Subscribers
  - name: Net Additions
    synonyms: [Net Adds, Net Subscriber Additions]
    definition: Gross additions less disconnections - how much the base grew.
    formula: Gross additions - Disconnections
    dax: '[Gross Additions] - [Disconnections]'
    unit: count
    aggregation: sum
    domain: Subscribers
  - name: Churn Rate %
    synonyms: [Churn %, Monthly Churn, Subscriber Churn Rate, Disconnection Rate]
    definition: Share of the opening subscribers that disconnected in the period. Monthly churn is measured over a month.
    formula: Disconnections / Opening subscribers
    dax: DIVIDE ( [Disconnections], [Opening Subscribers] )
    unit: percent
    aggregation: ratio
    domain: Subscribers
  - name: Port Outs
    synonyms: [MNP Outs, Ported Out Numbers]
    definition: Subscribers who moved their number to another operator in the period.
    formula: Count of completed port-out requests
    unit: count
    aggregation: sum
    domain: Subscribers
  - name: Data Users
    synonyms: [Active Data Users, Data Subscribers]
    definition: Subscribers who used at least 1 MB of mobile data in the period.
    formula: Distinct count of subscribers with data usage above 1 MB
    unit: count
    aggregation: distinct_count
    domain: Usage
  - name: Data Penetration %
    synonyms: [Data User Share, Data Adoption %, Data Subscriber %]
    definition: Share of active subscribers who use mobile data.
    formula: Data users / Active subscribers
    dax: DIVIDE ( [Data Users], [Active Subscribers] )
    unit: percent
    aggregation: ratio
    domain: Usage
  # ---------------- revenue and ARPU
  - name: Service Revenue
    synonyms: [Telecom Revenue, Services Revenue, Network Revenue]
    definition: Revenue from voice, data, messaging, roaming and value added services, excluding handset and equipment sales.
    formula: Sum of recognized service revenue
    unit: currency
    aggregation: sum
    domain: Revenue
  - name: ARPU
    synonyms: [Average Revenue per User, Revenue per Subscriber, Monthly ARPU]
    definition: Service revenue per average subscriber, per month.
    formula: Service revenue / Average subscribers / Months in the period
    dax: DIVIDE ( [Service Revenue], [Average Subscribers] )
    unit: currency
    aggregation: ratio
    time: per month (divide by months when the period is longer)
    domain: Revenue
  - name: Data Revenue
    synonyms: [Data Rev, Mobile Data Revenue, Internet Revenue]
    definition: Revenue from mobile and fixed data services.
    formula: Sum of data service revenue
    unit: currency
    aggregation: sum
    domain: Revenue
  - name: Data Revenue Share %
    synonyms: [Data Share of Revenue, Data Revenue Mix %, Data Contribution %]
    definition: Data revenue as a share of service revenue.
    formula: Data revenue / Service revenue
    dax: DIVIDE ( [Data Revenue], [Service Revenue] )
    unit: percent
    aggregation: ratio
    domain: Revenue
  - name: Recharge Value
    synonyms: [Recharge Amount, Top-Up Value, Prepaid Recharge Value]
    definition: Money added to prepaid accounts in the period (top-ups and vouchers).
    formula: Sum of recharge amounts
    unit: currency
    aggregation: sum
    domain: Revenue
  - name: Recharges
    synonyms: [Recharge Count, Top-Ups, Number of Recharges]
    definition: Number of recharge transactions in the period.
    formula: Count of distinct recharge transactions
    unit: count
    aggregation: distinct_count
    domain: Revenue
  - name: Average Recharge Value
    synonyms: [Average Top-Up, Average Recharge Amount, Recharge per Transaction]
    definition: Recharge value per recharge transaction.
    formula: Recharge value / Recharges
    dax: DIVIDE ( [Recharge Value], [Recharges] )
    unit: currency
    aggregation: ratio
    domain: Revenue
  - name: Billed Amount
    synonyms: [Billing Amount, Invoiced Amount, Postpaid Billing]
    definition: Amount invoiced to postpaid customers in the period.
    formula: Sum of bill amounts
    unit: currency
    aggregation: sum
    domain: Billing
  - name: Collections
    synonyms: [Bill Collections, Payments Received, Cash Collected]
    definition: Money collected against bills in the period.
    formula: Sum of bill payments
    unit: currency
    aggregation: sum
    domain: Billing
  - name: Collection Efficiency %
    synonyms: [Collection Rate, Collection Efficiency, Billing Collection %]
    definition: Share of billed amount collected in the period.
    formula: Collections / Billed amount
    dax: DIVIDE ( [Collections], [Billed Amount] )
    unit: percent
    aggregation: ratio
    domain: Billing
  - name: Acquisition Cost
    synonyms: [Subscriber Acquisition Spend, Acquisition Spend]
    definition: Cost of winning new subscribers - dealer commission, handset subsidy and marketing.
    formula: Sum of commissions, subsidies and acquisition marketing
    unit: currency
    aggregation: sum
    domain: Acquisition
  - name: Subscriber Acquisition Cost
    synonyms: [SAC, Cost per Gross Add, CPGA, Customer Acquisition Cost]
    definition: Acquisition cost for each new connection.
    formula: Acquisition cost / Gross additions
    dax: DIVIDE ( [Acquisition Cost], [Gross Additions] )
    unit: currency
    aggregation: ratio
    domain: Acquisition
  # ---------------- usage
  - name: Data Usage
    synonyms: [Data Volume, Data Consumption, Data Traffic]
    definition: Data used by subscribers, in gigabytes.
    formula: Sum of data volume in gigabytes
    unit: number
    aggregation: sum
    domain: Usage
  - name: Data Usage per Subscriber
    synonyms: [Average Data Usage, GB per User, Data Consumption per Subscriber]
    definition: Gigabytes used per average subscriber, per month.
    formula: Data usage / Average subscribers
    dax: DIVIDE ( [Data Usage], [Average Subscribers] )
    unit: number
    aggregation: ratio
    time: per month
    domain: Usage
  - name: Voice Minutes
    synonyms: [Minutes of Use, Call Minutes, Voice Volume]
    definition: Minutes of calls made and received.
    formula: Sum of call duration in minutes
    unit: number
    aggregation: sum
    domain: Usage
  - name: MOU per Subscriber
    synonyms: [MOU, Minutes of Use per Subscriber, Average Minutes of Use]
    definition: Voice minutes per average subscriber, per month.
    formula: Voice minutes / Average subscribers
    dax: DIVIDE ( [Voice Minutes], [Average Subscribers] )
    unit: number
    aggregation: ratio
    time: per month
    domain: Usage
  # ---------------- network quality
  - name: Cell Sites
    synonyms: [Sites, Towers, Number of Sites]
    definition: Cell sites on air at the end of the period.
    formula: Count of distinct cell sites on air
    unit: count
    aggregation: last
    domain: Network
  - name: Site Scheduled Minutes
    synonyms: [Scheduled Minutes, Total Site Minutes]
    definition: Minutes cell sites should have been on air - sites times minutes in the period, planned outages excluded where the contract allows.
    formula: Sum over sites of scheduled minutes
    unit: duration
    aggregation: sum
    domain: Network
  - name: Site Available Minutes
    synonyms: [Available Minutes, Site Uptime Minutes]
    definition: Minutes cell sites were on air and carrying traffic.
    formula: Scheduled minutes - Outage minutes
    unit: duration
    aggregation: sum
    domain: Network
  - name: Network Availability %
    synonyms: [Site Availability, Network Uptime, Availability %]
    definition: Share of scheduled time the cell sites were available.
    formula: Site available minutes / Site scheduled minutes
    dax: DIVIDE ( [Site Available Minutes], [Site Scheduled Minutes] )
    unit: percent
    aggregation: ratio
    domain: Network
  - name: Call Attempts
    synonyms: [Attempted Calls, Call Setup Attempts]
    definition: Calls tried on the network.
    formula: Count of call set-up attempts
    unit: count
    aggregation: sum
    domain: Network
  - name: Successful Calls
    synonyms: [Connected Calls, Completed Calls]
    definition: Calls that connected.
    formula: Count of call attempts that connected
    unit: count
    aggregation: sum
    domain: Network
  - name: Call Success Rate %
    synonyms: [Call Setup Success Rate, CSSR, Call Completion Rate]
    definition: Share of call attempts that connected.
    formula: Successful calls / Call attempts
    dax: DIVIDE ( [Successful Calls], [Call Attempts] )
    unit: percent
    aggregation: ratio
    domain: Network
  - name: Dropped Calls
    synonyms: [Call Drops, Calls Dropped]
    definition: Connected calls that ended abnormally, not by the user.
    formula: Count of connected calls released abnormally
    unit: count
    aggregation: sum
    domain: Network
  - name: Call Drop Rate %
    synonyms: [Drop Call Rate, DCR, Call Drop %]
    definition: Share of connected calls that dropped.
    formula: Dropped calls / Successful calls
    dax: DIVIDE ( [Dropped Calls], [Successful Calls] )
    unit: percent
    aggregation: ratio
    domain: Network
  - name: Average Download Speed
    synonyms: [Download Speed, Average Throughput, DL Throughput]
    definition: Average download speed in megabits per second.
    formula: Average of measured download speed
    unit: number
    aggregation: average
    domain: Network
  # ---------------- customer care
  - name: Support Tickets
    synonyms: [Tickets, Complaints, Service Requests]
    definition: Complaints and service requests raised in the period.
    formula: Count of distinct tickets
    unit: count
    aggregation: distinct_count
    domain: Care
  - name: Tickets Resolved Within SLA
    synonyms: [Resolved Within SLA, SLA Met Tickets]
    definition: Tickets closed within the time promised for their category.
    formula: Count of tickets closed within SLA
    unit: count
    aggregation: distinct_count
    domain: Care
  - name: SLA Compliance %
    synonyms: [Tickets Within SLA %, Resolution within SLA %, SLA Adherence]
    definition: Share of tickets resolved within SLA.
    formula: Tickets resolved within SLA / Support tickets
    dax: DIVIDE ( [Tickets Resolved Within SLA], [Support Tickets] )
    unit: percent
    aggregation: ratio
    domain: Care
  - name: Complaints per 1000 Subscribers
    synonyms: [Tickets per 1000 Subscribers, Complaint Rate]
    definition: Tickets raised for every 1,000 average subscribers.
    formula: Support tickets / Average subscribers x 1,000
    dax: DIVIDE ( [Support Tickets], [Average Subscribers] ) * 1000
    unit: number
    aggregation: ratio
    domain: Care

# Industry pack: insurance (general, health and life insurers, brokers). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Insurance
order: 65
description: Insurers and their distribution. Premiums written and earned, policies and renewals, claims and reserves, loss ratio, expense ratio and combined ratio, agents and channels.
questions:
  - What was gross written premium by line of business and by region this quarter, compared with last year?
  - What is the loss ratio by product and by year of loss, and which lines run above 70 percent?
  - What is the combined ratio by line of business over the last 8 quarters?
  - What share of policies renewed last month, and which agents have the lowest renewal rate?
  - How long does it take to settle claims, and what is the claim rejection rate by cause?
  - Which distribution channels bring the most new business premium?


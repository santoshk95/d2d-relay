kpis:
  # ---------------- premium
  - name: Gross Written Premium
    synonyms: [GWP, Gross Premium, Written Premium, Premium Written]
    definition: Premium on policies written in the period, before reinsurance, taxes excluded.
    formula: Sum of premiums on policies and endorsements written in the period
    unit: currency
    aggregation: sum
    time: by policy issue date
    domain: Premium
  - name: Gross Written Premium LY
    synonyms: [GWP LY, Gross Written Premium Last Year, Written Premium LY]
    definition: Gross written premium in the same period last year.
    formula: Gross written premium for the same period one year earlier
    unit: currency
    aggregation: sum
    time: same period last year
    domain: Premium
  - name: Premium Growth %
    synonyms: [GWP Growth %, Written Premium Growth, YoY Premium Growth]
    definition: Change in gross written premium against the same period last year.
    formula: (Gross written premium - Gross written premium last year) / Gross written premium last year
    dax: DIVIDE ( [Gross Written Premium] - [Gross Written Premium LY], [Gross Written Premium LY] )
    unit: percent
    aggregation: ratio
    domain: Premium
  - name: Ceded Premium
    synonyms: [Reinsurance Premium, Premium Ceded, Outward Premium]
    definition: Premium passed to reinsurers in the period.
    formula: Sum of premium ceded under treaties and facultative cover
    unit: currency
    aggregation: sum
    domain: Premium
  - name: Net Written Premium
    synonyms: [NWP, Net Premium Written, Retained Premium]
    definition: Written premium kept after reinsurance.
    formula: Gross written premium - Ceded premium
    dax: '[Gross Written Premium] - [Ceded Premium]'
    unit: currency
    aggregation: sum
    domain: Premium
  - name: Net Retention %
    synonyms: [Retention Ratio, Premium Retention Ratio, Net Retention Ratio]
    definition: Share of written premium kept after reinsurance.
    formula: Net written premium / Gross written premium
    dax: DIVIDE ( [Net Written Premium], [Gross Written Premium] )
    unit: percent
    aggregation: ratio
    domain: Premium
  - name: Earned Premium
    synonyms: [EP, Premium Earned, Gross Earned Premium]
    definition: The part of written premium that belongs to the period - the cover already provided (written premium spread over the policy term).
    formula: Written premium times the share of the policy term elapsed in the period
    unit: currency
    aggregation: sum
    domain: Premium
  - name: New Business Premium
    synonyms: [NBP, First Year Premium, FYP]
    definition: Premium on policies sold to new customers or products in the period.
    formula: Sum of premium on new business policies
    filters: [Business type = New]
    unit: currency
    aggregation: sum
    domain: Premium
  - name: Renewal Premium
    synonyms: [Renewal Premium Income, Renewed Premium]
    definition: Premium on renewed policies in the period.
    formula: Sum of premium on renewal policies
    filters: [Business type = Renewal]
    unit: currency
    aggregation: sum
    domain: Premium
  - name: Average Premium per Policy
    synonyms: [Average Premium, Premium per Policy, Average Ticket Size]
    definition: Gross written premium for each policy written.
    formula: Gross written premium / Policies issued
    dax: DIVIDE ( [Gross Written Premium], [Policies Issued] )
    unit: currency
    aggregation: ratio
    domain: Premium
  - name: Sum Insured
    synonyms: [Total Sum Insured, TSI, Sum Assured]
    definition: Total cover on the policies in force - what the insurer would pay in a full loss.
    formula: Sum of sums insured on policies in force
    unit: currency
    aggregation: sum
    domain: Premium
  # ---------------- policies and renewals
  - name: New Policies
    synonyms: [New Business Policies, New Policy Count]
    definition: Policies sold to customers new to the product in the period.
    formula: Count of distinct new business policies issued
    filters: [Business type = New]
    unit: count
    aggregation: distinct_count
    domain: Policies
  - name: Policies Renewed
    synonyms: [Renewed Policies, Renewals]
    definition: Expiring policies that were renewed.
    formula: Count of expiring policies with a renewal within the grace period
    unit: count
    aggregation: distinct_count
    domain: Policies
  - name: Policies Issued
    synonyms: [Policies Written, Policies Sold, Policy Count]
    definition: Policies written in the period, new and renewed.
    formula: New policies + Policies renewed
    dax: '[New Policies] + [Policies Renewed]'
    unit: count
    aggregation: distinct_count
    domain: Policies
  - name: Policies Due for Renewal
    synonyms: [Renewals Due, Expiring Policies, Renewal Base]
    definition: Policies whose cover ends in the period.
    formula: Count of policies with an end date in the period
    unit: count
    aggregation: distinct_count
    time: by policy end date
    domain: Policies
  - name: Renewal Rate %
    synonyms: [Renewal Ratio, Policy Retention Rate, Retention Rate %, Renewal %]
    definition: Share of policies due for renewal that were renewed.
    formula: Policies renewed / Policies due for renewal
    dax: DIVIDE ( [Policies Renewed], [Policies Due for Renewal] )
    unit: percent
    aggregation: ratio
    domain: Policies
  - name: Policies in Force
    synonyms: [PIF, Active Policies, In-Force Policies]
    definition: Policies in cover at the end of the period.
    formula: Count of policies with start date <= period end and end date >= period end
    unit: count
    aggregation: last
    domain: Policies
  - name: Quotes
    synonyms: [Quotations, Quote Count]
    definition: Quotes given to prospects in the period.
    formula: Count of distinct quotes
    unit: count
    aggregation: distinct_count
    domain: Sales
  - name: Quote to Bind Rate %
    synonyms: [Conversion Rate, Quote Conversion %, Hit Ratio, Quote to Policy %]
    definition: Share of quotes that became new policies.
    formula: New policies / Quotes
    dax: DIVIDE ( [New Policies], [Quotes] )
    unit: percent
    aggregation: ratio
    domain: Sales
  # ---------------- claims
  - name: Claims Reported
    synonyms: [Claim Count, Claims Registered, Claims Notified]
    definition: Claims notified to the insurer in the period.
    formula: Count of distinct claims by reported date
    unit: count
    aggregation: distinct_count
    time: by claim reported date
    domain: Claims
  - name: Claims Settled
    synonyms: [Settled Claims, Claims Paid Count]
    definition: Claims paid in the period.
    formula: Count of distinct claims with a payment in the period
    unit: count
    aggregation: distinct_count
    domain: Claims
  - name: Claims Rejected
    synonyms: [Rejected Claims, Repudiated Claims, Claims Denied]
    definition: Claims turned down in the period.
    formula: Count of distinct claims closed as rejected
    unit: count
    aggregation: distinct_count
    domain: Claims
  - name: Claim Settlement Ratio %
    synonyms: [Claim Settlement Ratio, Claims Paid Ratio, Settlement Rate]
    definition: Share of claims reported that were settled.
    formula: Claims settled / Claims reported
    dax: DIVIDE ( [Claims Settled], [Claims Reported] )
    unit: percent
    aggregation: ratio
    domain: Claims
  - name: Claim Rejection Rate %
    synonyms: [Claim Repudiation Ratio, Rejection Ratio, Claims Denied %]
    definition: Share of claims reported that were rejected.
    formula: Claims rejected / Claims reported
    dax: DIVIDE ( [Claims Rejected], [Claims Reported] )
    unit: percent
    aggregation: ratio
    domain: Claims
  - name: Claims Paid
    synonyms: [Paid Claims, Paid Losses, Claim Payments]
    definition: Money paid out on claims in the period.
    formula: Sum of claim payments
    unit: currency
    aggregation: sum
    domain: Claims
  - name: Outstanding Claims Reserve
    synonyms: [Case Reserve, Outstanding Claims, OS Claims Reserve]
    definition: Estimated cost of reported claims not yet paid, at the end of the period.
    formula: Sum of case reserves on open claims
    unit: currency
    aggregation: last
    domain: Claims
  - name: Claims Incurred
    synonyms: [Incurred Claims, Incurred Losses, Total Incurred]
    definition: Claims paid in the period plus the change in outstanding claim reserves.
    formula: Claims paid + Closing outstanding reserve - Opening outstanding reserve
    unit: currency
    aggregation: sum
    domain: Claims
  - name: Average Claim Cost
    synonyms: [Average Claim Severity, Claim Severity, Average Claim Size]
    definition: Average amount paid per settled claim.
    formula: Claims paid / Claims settled
    dax: DIVIDE ( [Claims Paid], [Claims Settled] )
    unit: currency
    aggregation: ratio
    domain: Claims
  - name: Earned Exposure
    synonyms: [Exposure, Policy Years, Earned Vehicle Years]
    definition: Policy years of cover provided in the period (a policy for six months counts 0.5).
    formula: Sum over policies of the fraction of a year covered in the period
    unit: number
    aggregation: sum
    domain: Claims
  - name: Claim Frequency
    synonyms: [Claims Frequency, Claims per Exposure Year]
    definition: Claims reported for each year of earned exposure.
    formula: Claims reported / Earned exposure
    dax: DIVIDE ( [Claims Reported], [Earned Exposure] )
    unit: ratio
    aggregation: ratio
    domain: Claims
  - name: Average Claim Settlement Days
    synonyms: [Claim Settlement TAT, Days to Settle, Claim Turnaround Time]
    definition: Average days from claim notification to settlement for claims settled in the period.
    formula: Average of (settlement date - reported date) in days
    unit: duration
    aggregation: average
    domain: Claims
  # ---------------- underwriting result
  - name: Loss Ratio %
    synonyms: [Loss Ratio, Claims Ratio, Incurred Claims Ratio, ICR]
    definition: Claims incurred as a share of earned premium - the share of premium that goes to claims.
    formula: Claims incurred / Earned premium
    dax: DIVIDE ( [Claims Incurred], [Earned Premium] )
    unit: percent
    aggregation: ratio
    domain: Underwriting
  - name: Commission Expense
    synonyms: [Commission, Commission Paid, Brokerage, Acquisition Cost]
    definition: Commission and brokerage paid to agents and brokers.
    formula: Sum of commission on policies written
    unit: currency
    aggregation: sum
    domain: Underwriting
  - name: Commission Rate %
    synonyms: [Commission Ratio, Brokerage Rate]
    definition: Commission as a share of gross written premium.
    formula: Commission expense / Gross written premium
    dax: DIVIDE ( [Commission Expense], [Gross Written Premium] )
    unit: percent
    aggregation: ratio
    domain: Underwriting
  - name: Underwriting Expense
    synonyms: [Management Expenses, Operating Expenses, Expenses of Management]
    definition: Operating expenses of writing and servicing business, commission excluded.
    formula: Sum of underwriting, policy servicing and overhead expenses
    unit: currency
    aggregation: sum
    domain: Underwriting
  - name: Expense Ratio %
    synonyms: [Expense Ratio, Cost Ratio, Underwriting Expense Ratio]
    definition: Commission and underwriting expenses as a share of earned premium.
    formula: (Commission expense + Underwriting expense) / Earned premium
    dax: DIVIDE ( [Commission Expense] + [Underwriting Expense], [Earned Premium] )
    unit: percent
    aggregation: ratio
    domain: Underwriting
  - name: Combined Ratio %
    synonyms: [Combined Ratio, COR, Combined Operating Ratio]
    definition: Loss ratio plus expense ratio. Below 100% the insurer makes an underwriting profit.
    formula: Loss ratio + Expense ratio
    dax: '[Loss Ratio %] + [Expense Ratio %]'
    unit: percent
    aggregation: ratio
    domain: Underwriting
  - name: Underwriting Result
    synonyms: [Underwriting Profit, Underwriting Profit or Loss, Underwriting Margin]
    definition: Earned premium less claims incurred, commission and underwriting expenses (investment income left out).
    formula: Earned premium - Claims incurred - Commission expense - Underwriting expense
    dax: '[Earned Premium] - [Claims Incurred] - [Commission Expense] - [Underwriting Expense]'
    unit: currency
    aggregation: sum
    domain: Underwriting

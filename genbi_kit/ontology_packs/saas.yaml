kpis:
  # ---------------- recurring revenue
  - name: MRR
    synonyms: [Monthly Recurring Revenue, Recurring Revenue, Closing MRR]
    definition: Value of active subscriptions normalised to one month, at the end of the period. Annual contracts are divided by 12, one-time fees, usage overage and services are excluded.
    formula: Sum of monthly value of active subscriptions
    unit: currency
    aggregation: last
    domain: Recurring Revenue
  - name: ARR
    synonyms: [Annual Recurring Revenue, Annualized Recurring Revenue, Annual Run Rate]
    definition: MRR annualised.
    formula: MRR x 12
    dax: '[MRR] * 12'
    unit: currency
    aggregation: last
    domain: Recurring Revenue
  - name: Opening MRR
    synonyms: [Beginning MRR, MRR at Start, Starting MRR]
    definition: MRR at the start of the period (the closing MRR of the previous period).
    formula: MRR at the end of the previous period
    unit: currency
    aggregation: last
    domain: Recurring Revenue
  - name: New MRR
    synonyms: [New Business MRR, New Logo MRR]
    definition: MRR from customers who started paying in the period.
    formula: Sum of MRR of subscriptions that started in the period
    unit: currency
    aggregation: sum
    domain: Recurring Revenue
  - name: Expansion MRR
    synonyms: [Upsell MRR, Upgrade MRR, Expansion Revenue]
    definition: Extra MRR from existing customers - upgrades, extra seats and add-ons.
    formula: Sum of MRR increases on customers that were also customers at the start of the period
    unit: currency
    aggregation: sum
    domain: Recurring Revenue
  - name: Contraction MRR
    synonyms: [Downgrade MRR, Downsell MRR]
    definition: MRR lost from existing customers who downgraded and stayed.
    formula: Sum of MRR decreases on customers still active at period end
    unit: currency
    aggregation: sum
    domain: Recurring Revenue
  - name: Churned MRR
    synonyms: [MRR Churn, Cancelled MRR, Lost MRR]
    definition: MRR lost from customers who cancelled in the period.
    formula: Sum of MRR of customers who cancelled in the period
    unit: currency
    aggregation: sum
    domain: Recurring Revenue
  - name: Net New MRR
    synonyms: [Net New ARR, Net MRR Movement, Net MRR Change]
    definition: Net change in MRR in the period.
    formula: New MRR + Expansion MRR - Contraction MRR - Churned MRR
    dax: '[New MRR] + [Expansion MRR] - [Contraction MRR] - [Churned MRR]'
    unit: currency
    aggregation: sum
    domain: Recurring Revenue
  - name: MRR Growth %
    synonyms: [MRR Growth Rate, Monthly Growth Rate, ARR Growth %]
    definition: Net new MRR as a share of opening MRR.
    formula: Net new MRR / Opening MRR
    dax: DIVIDE ( [Net New MRR], [Opening MRR] )
    unit: percent
    aggregation: ratio
    domain: Recurring Revenue
  - name: Gross Revenue Retention %
    synonyms: [GRR, GRR %, Gross Dollar Retention, Gross MRR Retention]
    definition: Share of opening MRR kept after churn and contraction, expansion not counted. It cannot exceed 100%.
    formula: (Opening MRR - Contraction MRR - Churned MRR) / Opening MRR
    dax: DIVIDE ( [Opening MRR] - [Contraction MRR] - [Churned MRR], [Opening MRR] )
    unit: percent
    aggregation: ratio
    domain: Retention
  - name: Net Revenue Retention %
    synonyms: [NRR, NRR %, Net Dollar Retention, NDR, Net MRR Retention]
    definition: Share of opening MRR kept after churn, contraction and expansion, from the same customers, new customers not counted. Above 100% means existing customers grow.
    formula: (Opening MRR + Expansion MRR - Contraction MRR - Churned MRR) / Opening MRR
    dax: DIVIDE ( [Opening MRR] + [Expansion MRR] - [Contraction MRR] - [Churned MRR], [Opening MRR] )
    unit: percent
    aggregation: ratio
    domain: Retention
  # ---------------- customers
  - name: Active Customers
    synonyms: [Paying Customers, Customers, Active Accounts]
    definition: Customers with an active paid subscription at the end of the period; free and trial accounts not counted.
    formula: Count of distinct customers with an active paid subscription
    unit: count
    aggregation: last
    domain: Customers
  - name: Opening Customers
    synonyms: [Beginning Customers, Customers at Start]
    definition: Paying customers at the start of the period.
    formula: Active customers at the end of the previous period
    unit: count
    aggregation: last
    domain: Customers
  - name: New Customers
    synonyms: [New Logos, New Paying Customers]
    definition: Customers who started paying in the period.
    formula: Count of customers with their first paid subscription in the period
    unit: count
    aggregation: sum
    domain: Customers
  - name: Churned Customers
    synonyms: [Lost Customers, Lost Logos, Cancelled Customers]
    definition: Customers whose last paid subscription ended in the period.
    formula: Count of customers who cancelled in the period
    unit: count
    aggregation: sum
    domain: Customers
  - name: Customer Churn Rate %
    synonyms: [Logo Churn, Logo Churn Rate, Churn Rate %, Customer Churn %]
    definition: Share of the opening customers who cancelled in the period (monthly when measured over a month).
    formula: Churned customers / Opening customers
    dax: DIVIDE ( [Churned Customers], [Opening Customers] )
    unit: percent
    aggregation: ratio
    domain: Retention
  - name: ARPA
    synonyms: [Average Revenue per Account, ARPU, Average Revenue per User, Average MRR per Customer]
    definition: MRR for each active customer.
    formula: MRR / Active customers
    dax: DIVIDE ( [MRR], [Active Customers] )
    unit: currency
    aggregation: ratio
    domain: Customers
  # ---------------- profitability and unit economics
  - name: Recognized Revenue
    synonyms: [Revenue, Total Revenue, Subscription Revenue, GAAP Revenue]
    definition: Revenue booked in the period under revenue recognition rules (subscriptions spread over the term).
    formula: Sum of recognized revenue
    unit: currency
    aggregation: sum
    domain: Financials
  - name: Cost of Revenue
    synonyms: [COGS, Cost of Goods Sold, Cost of Subscription Revenue]
    definition: Cost of delivering the service - hosting, customer support and onboarding, payment fees.
    formula: Sum of hosting, support, onboarding and payment-processing cost
    unit: currency
    aggregation: sum
    domain: Financials
  - name: Gross Margin
    synonyms: [Gross Profit, Gross Margin $]
    definition: Recognized revenue less cost of revenue.
    formula: Recognized revenue - Cost of revenue
    dax: '[Recognized Revenue] - [Cost of Revenue]'
    unit: currency
    aggregation: sum
    domain: Financials
  - name: Gross Margin %
    synonyms: [GM %, Subscription Gross Margin, Gross Profit %]
    definition: Gross margin as a share of recognized revenue.
    formula: Gross margin / Recognized revenue
    dax: DIVIDE ( [Gross Margin], [Recognized Revenue] )
    unit: percent
    aggregation: ratio
    domain: Financials
  - name: Sales and Marketing Spend
    synonyms: [S&M Spend, Sales and Marketing Expense, Acquisition Spend, GTM Spend]
    definition: Cost of winning new customers - marketing programs, sales salaries, commissions and tools.
    formula: Sum of sales and marketing expenses
    unit: currency
    aggregation: sum
    domain: Unit Economics
  - name: Customer Acquisition Cost
    synonyms: [CAC, Blended CAC, Cost per New Customer]
    definition: Sales and marketing spend for each new customer.
    formula: Sales and marketing spend / New customers
    dax: DIVIDE ( [Sales and Marketing Spend], [New Customers] )
    unit: currency
    aggregation: ratio
    domain: Unit Economics
  - name: Customer Lifetime Value
    synonyms: [LTV, CLV, CLTV, Customer LTV]
    definition: Gross margin a customer is expected to bring over its life - ARPA times gross margin % divided by the customer churn rate (monthly figures).
    formula: ARPA x Gross margin % / Customer churn rate
    dax: DIVIDE ( [ARPA] * [Gross Margin %], [Customer Churn Rate %] )
    unit: currency
    aggregation: ratio
    time: monthly ARPA and monthly churn rate
    domain: Unit Economics
  - name: LTV to CAC Ratio
    synonyms: [LTV:CAC, LTV/CAC, LTV to CAC]
    definition: How many times the lifetime value covers the cost of winning the customer. Three or more is the usual target.
    formula: Customer lifetime value / Customer acquisition cost
    dax: DIVIDE ( [Customer Lifetime Value], [Customer Acquisition Cost] )
    unit: ratio
    aggregation: ratio
    domain: Unit Economics
  - name: CAC Payback Months
    synonyms: [CAC Payback Period, Payback Period, Months to Recover CAC]
    definition: Months of gross margin from a new customer needed to repay the cost of winning it.
    formula: Customer acquisition cost / (ARPA x Gross margin %)
    dax: DIVIDE ( [Customer Acquisition Cost], [ARPA] * [Gross Margin %] )
    unit: duration
    aggregation: ratio
    time: months, with monthly ARPA
    domain: Unit Economics
  # ---------------- funnel and product usage
  - name: Signups
    synonyms: [Sign-Ups, New Signups, Registrations]
    definition: New accounts created in the period (free, trial or paid).
    formula: Count of distinct accounts created
    unit: count
    aggregation: distinct_count
    domain: Funnel
  - name: Activated Accounts
    synonyms: [Activations, Activated Users]
    definition: New accounts that reached the product's activation milestone (the key first action) within the activation window.
    formula: Count of new accounts that completed the activation event
    unit: count
    aggregation: distinct_count
    domain: Funnel
  - name: Activation Rate %
    synonyms: [Signup to Activation %, Activation %]
    definition: Share of signups that activated.
    formula: Activated accounts / Signups
    dax: DIVIDE ( [Activated Accounts], [Signups] )
    unit: percent
    aggregation: ratio
    domain: Funnel
  - name: Trials Started
    synonyms: [Trials, New Trials, Trial Starts]
    definition: Free trials begun in the period.
    formula: Count of distinct trials started
    unit: count
    aggregation: distinct_count
    domain: Funnel
  - name: Trials Converted
    synonyms: [Trial Conversions, Converted Trials, Trial to Paid]
    definition: Trials that became paid subscriptions.
    formula: Count of trials that turned into a paid subscription
    unit: count
    aggregation: distinct_count
    domain: Funnel
  - name: Trial Conversion Rate %
    synonyms: [Trial to Paid %, Trial Conversion %, Free Trial Conversion]
    definition: Share of trials that became paying customers (trials that have run their full length).
    formula: Trials converted / Trials started
    dax: DIVIDE ( [Trials Converted], [Trials Started] )
    unit: percent
    aggregation: ratio
    domain: Funnel
  - name: Monthly Active Users
    synonyms: [MAU, Monthly Users, Active Users]
    definition: Distinct users who did a qualifying action in the product in the month.
    formula: Distinct count of users with a qualifying event in the last 30 days
    unit: count
    aggregation: distinct_count
    time: calendar month or rolling 30 days
    domain: Usage
  - name: Daily Active Users
    synonyms: [DAU, Daily Users]
    definition: Average number of distinct users active on a day.
    formula: Average over days of distinct users with a qualifying event
    unit: count
    aggregation: average
    domain: Usage
  - name: Stickiness %
    synonyms: [DAU to MAU Ratio, DAU/MAU, Product Stickiness]
    definition: How many of the monthly users come back on an average day.
    formula: Daily active users / Monthly active users
    dax: DIVIDE ( [Daily Active Users], [Monthly Active Users] )
    unit: percent
    aggregation: ratio
    domain: Usage
  - name: Deals Won
    synonyms: [Won Deals, Closed Won, Opportunities Won]
    definition: Sales opportunities closed as won in the period.
    formula: Count of opportunities with stage = Closed won
    unit: count
    aggregation: sum
    time: by close date
    domain: Sales
  - name: Deals Lost
    synonyms: [Lost Deals, Closed Lost, Opportunities Lost]
    definition: Sales opportunities closed as lost in the period.
    formula: Count of opportunities with stage = Closed lost
    unit: count
    aggregation: sum
    time: by close date
    domain: Sales
  - name: Win Rate %
    synonyms: [Close Rate, Deal Win Rate, Opportunity Win Rate]
    definition: Share of closed opportunities that were won.
    formula: Deals won / (Deals won + Deals lost)
    dax: DIVIDE ( [Deals Won], [Deals Won] + [Deals Lost] )
    unit: percent
    aggregation: ratio
    domain: Sales
  - name: Support Tickets
    synonyms: [Tickets, Support Cases, Support Requests]
    definition: Support requests raised by customers in the period.
    formula: Count of distinct tickets created
    unit: count
    aggregation: distinct_count
    domain: Customer Success
  - name: NPS
    synonyms: [Net Promoter Score, NPS Score]
    definition: Percent of promoters (scores 9 and 10) minus percent of detractors (scores 0 to 6), from survey answers.
    formula: "Share of promoters - Share of detractors, in percent points"
    unit: number
    aggregation: custom
    domain: Customer Success

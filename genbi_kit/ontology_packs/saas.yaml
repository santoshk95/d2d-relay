# Industry pack: software and subscriptions (SaaS). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Software and subscriptions
order: 45
description: SaaS and subscription businesses. Recurring revenue (MRR and ARR) and its movements, churn and net revenue retention, customer acquisition cost and lifetime value, trials, activation, product usage and pipeline.
questions:
  - How did MRR move last month - new, expansion, contraction and churn?
  - What is our net revenue retention by customer segment and by plan?
  - What is the customer acquisition cost and the CAC payback period by acquisition channel?
  - Which cohorts have the lowest retention after 6 months?
  - What share of trials convert to paying customers, and what share of signups activate?
  - How many monthly active users do we have by plan, and what is daily to monthly stickiness?

terms:
  # ---------------- measures: recurring revenue
  - {name: MRR, kind: measure, unit: currency, aggregation: last, description: "Monthly recurring revenue - the value of active subscriptions, normalised to one month, at the end of the period.",
     synonyms: [monthly recurring revenue, mrr amount, recurring revenue, monthly recurring, current mrr, closing mrr, ending mrr, subscription mrr, normalized mrr, mrr usd, monthly revenue run rate]}
  - {name: ARR, kind: measure, unit: currency, aggregation: last, description: "Annual recurring revenue - MRR times 12 (or the annualised contract value).",
     synonyms: [annual recurring revenue, arr amount, annualized recurring revenue, annualised recurring revenue, current arr, closing arr, ending arr, annual run rate, run rate revenue, annualized revenue]}
  - {name: Opening MRR, kind: measure, unit: currency, aggregation: last, description: "MRR at the start of the period.",
     synonyms: [beginning mrr, starting mrr, mrr start, mrr opening, opening recurring revenue, bop mrr, prior period mrr, previous mrr, mrr beginning of period]}

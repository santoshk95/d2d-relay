# Industry pack: supply chain and logistics. Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Supply chain and logistics
order: 50
description: Shippers, carriers and warehouse operators. Shipments and deliveries, on-time and in-full service, freight and warehousing cost, transit times, warehouse picking, storage use, inventory and fleet.
questions:
  - What was our OTIF percent by customer and by lane last month?
  - Which carriers have the worst on-time delivery rate, and what is their freight cost per kilogram?
  - How has freight cost per shipment changed by transport mode over the last 12 months?
  - Which warehouses have the lowest picks per labor hour and pick accuracy this week?
  - What is the average transit time by lane, and where are shipments most often late?
  - How full are our warehouses and trucks, by site and by week?


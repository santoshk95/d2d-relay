kpis:
  # ---------------- service
  - name: Shipments
    synonyms: [Shipment Count, Consignments, Number of Shipments]
    definition: Shipments sent in the period (one consignment from one origin to one destination).
    formula: Count of distinct shipments
    unit: count
    aggregation: distinct_count
    time: by ship date
    domain: Transport
  - name: Deliveries
    synonyms: [Delivery Count, Delivered Shipments]
    definition: Shipments delivered in the period.
    formula: Count of distinct shipments with a delivery date in the period
    unit: count
    aggregation: distinct_count
    time: by delivery date
    domain: Service
  - name: On Time Deliveries
    synonyms: [Deliveries On Time, On-Time Count]
    definition: Deliveries that arrived within the promised delivery window (on or before the promised date and time, with the tolerance the contract allows).
    formula: Count of deliveries with delivery date <= promised date
    unit: count
    aggregation: distinct_count
    domain: Service
  - name: On-Time Delivery %
    synonyms: [OTD, OTD %, On Time Delivery Rate, Delivery Punctuality]
    definition: Share of deliveries that arrived on time.
    formula: On time deliveries / Deliveries
    dax: DIVIDE ( [On Time Deliveries], [Deliveries] )
    unit: percent
    aggregation: ratio
    domain: Service
  - name: OTIF Deliveries
    synonyms: [OTIF Count, Deliveries On Time and In Full]
    definition: Deliveries that arrived on time and with every ordered line and quantity.
    formula: Count of deliveries that were on time and complete
    unit: count
    aggregation: distinct_count
    domain: Service
  - name: OTIF %
    synonyms: [On-Time In-Full %, On Time In Full, OTIF Rate]
    definition: Share of deliveries that were both on time and in full.
    formula: OTIF deliveries / Deliveries
    dax: DIVIDE ( [OTIF Deliveries], [Deliveries] )
    unit: percent
    aggregation: ratio
    domain: Service
  - name: Order Lines Ordered
    synonyms: [Lines Ordered, Ordered Lines]
    definition: Order lines customers asked for.
    formula: Count of order lines
    unit: count
    aggregation: sum
    domain: Service
  - name: Order Lines Shipped
    synonyms: [Lines Shipped, Lines Fulfilled]
    definition: Order lines shipped in full.
    formula: Count of order lines shipped complete
    unit: count
    aggregation: sum
    domain: Service
  - name: Line Fill Rate %
    synonyms: [Fill Rate, Fill Rate %, Order Line Fill Rate]
    definition: Share of ordered lines shipped in full.
    formula: Order lines shipped / Order lines ordered
    dax: DIVIDE ( [Order Lines Shipped], [Order Lines Ordered] )
    unit: percent
    aggregation: ratio
    domain: Service
  - name: Average Transit Time
    synonyms: [Transit Time, Average Transit Days, Delivery Lead Time]
    definition: Average days from pickup to delivery of delivered shipments.
    formula: Average of (delivery date - ship date) in days
    unit: duration
    aggregation: average
    domain: Transport
  - name: Average Delay Days
    synonyms: [Average Days Late, Delay Days]
    definition: Average days late of deliveries that arrived after the promised date.
    formula: Average of (delivery date - promised date) for late deliveries
    filters: [Delivery date after promised date]
    unit: duration
    aggregation: average
    domain: Service
  - name: Order Cycle Time
    synonyms: [Order to Delivery Time, Order Lead Time]
    definition: Average days from the customer placing the order to delivery.
    formula: Average of (delivery date - order date) in days
    unit: duration
    aggregation: average
    domain: Service
  - name: Average Dwell Time
    synonyms: [Dwell Time, Truck Turnaround Time, Yard Time]
    definition: Average hours a vehicle or container waits at a site between arrival and departure.
    formula: Average of (departure time - arrival time) in hours
    unit: duration
    aggregation: average
    domain: Transport
  - name: Damaged Shipments
    synonyms: [Damage Claims, Shipments Damaged]
    definition: Delivered shipments reported damaged or with missing goods.
    formula: Count of shipments with a damage or shortage report
    unit: count
    aggregation: distinct_count
    domain: Service
  - name: Damage Rate %
    synonyms: [Damage %, Loss and Damage Rate, Claims Rate]
    definition: Share of deliveries that arrived damaged.
    formula: Damaged shipments / Deliveries
    dax: DIVIDE ( [Damaged Shipments], [Deliveries] )
    unit: percent
    aggregation: ratio
    domain: Service
  # ---------------- cost
  - name: Freight Cost
    synonyms: [Freight Spend, Transportation Cost, Transport Cost, Freight Charges]
    definition: What carriers charged to move the goods - base rate, fuel surcharge and accessorials.
    formula: Sum of carrier invoice amounts
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Warehousing Cost
    synonyms: [Warehouse Cost, Storage and Handling Cost]
    definition: Cost of storing and handling goods in warehouses, own or third party.
    formula: Sum of warehouse labor, rent, utilities and 3PL warehouse charges
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Logistics Cost
    synonyms: [Total Logistics Cost, Supply Chain Cost, Distribution Cost]
    definition: Freight and warehousing cost together.
    formula: Freight cost + Warehousing cost
    dax: '[Freight Cost] + [Warehousing Cost]'
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Net Sales
    synonyms: [Net Revenue, Sales Value]
    definition: Net sales value of the goods moved, the base for cost-to-sales ratios.
    formula: Sum of invoice value after discounts
    unit: currency
    aggregation: sum
    domain: Cost
  - name: Logistics Cost % of Sales
    synonyms: [Logistics Cost %, Supply Chain Cost % of Sales, Logistics Cost to Sales]
    definition: Logistics cost as a share of net sales.
    formula: Logistics cost / Net sales
    dax: DIVIDE ( [Logistics Cost], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Cost
  - name: Freight Cost per Shipment
    synonyms: [Cost per Shipment, Average Freight Cost per Shipment]
    definition: Freight cost for each shipment sent.
    formula: Freight cost / Shipments
    dax: DIVIDE ( [Freight Cost], [Shipments] )
    unit: currency
    aggregation: ratio
    domain: Cost
  - name: Shipment Weight
    synonyms: [Weight Shipped, Total Weight, Chargeable Weight]
    definition: Weight shipped, in one unit (kilograms) across all shipments.
    formula: Sum of shipment weights in kilograms
    unit: number
    aggregation: sum
    domain: Transport
  - name: Freight Cost per Kg
    synonyms: [Cost per Kg, Freight Cost per Kilogram, Freight Rate per Kg]
    definition: Freight cost for each kilogram shipped.
    formula: Freight cost / Shipment weight
    dax: DIVIDE ( [Freight Cost], [Shipment Weight] )
    unit: currency
    aggregation: ratio
    domain: Cost
  # ---------------- warehouse
  - name: Lines Picked
    synonyms: [Picks, Pick Lines, Order Lines Picked]
    definition: Order lines picked in the warehouse.
    formula: Count of completed pick tasks (lines)
    unit: count
    aggregation: sum
    domain: Warehouse
  - name: Pick Errors
    synonyms: [Picking Errors, Mispicks]
    definition: Picks found wrong at pack or check (wrong item or quantity).
    formula: Count of picks with an error
    unit: count
    aggregation: sum
    domain: Warehouse
  - name: Pick Accuracy %
    synonyms: [Picking Accuracy, Pick Accuracy Rate]
    definition: Share of picks done without error.
    formula: 1 - Pick errors / Lines picked
    dax: 1 - DIVIDE ( [Pick Errors], [Lines Picked] )
    unit: percent
    aggregation: ratio
    domain: Warehouse
  - name: Pick Labor Hours
    synonyms: [Picker Hours, Picking Hours]
    definition: Hours worked by pickers.
    formula: Sum of hours booked to picking
    unit: number
    aggregation: sum
    domain: Warehouse
  - name: Lines Picked per Labor Hour
    synonyms: [Picks per Hour, Pick Rate, Picking Productivity]
    definition: Order lines picked for each hour of picker labor.
    formula: Lines picked / Pick labor hours
    dax: DIVIDE ( [Lines Picked], [Pick Labor Hours] )
    unit: ratio
    aggregation: ratio
    domain: Warehouse
  - name: Pallet Positions Used
    synonyms: [Occupied Positions, Positions Used]
    definition: Storage positions holding stock, average over the period.
    formula: Average of occupied storage positions
    unit: count
    aggregation: average
    domain: Warehouse
  - name: Pallet Positions Available
    synonyms: [Total Positions, Storage Capacity]
    definition: Storage positions the warehouse has in total, average over the period.
    formula: Average of storage positions available
    unit: count
    aggregation: average
    domain: Warehouse
  - name: Storage Utilization %
    synonyms: [Warehouse Utilization, Space Utilization, Storage Utilisation %]
    definition: Share of storage positions that hold stock.
    formula: Pallet positions used / Pallet positions available
    dax: DIVIDE ( [Pallet Positions Used], [Pallet Positions Available] )
    unit: percent
    aggregation: ratio
    domain: Warehouse
  # ---------------- inventory and fleet
  - name: Inventory Value
    synonyms: [Stock Value, Inventory at Cost]
    definition: Value of the stock on hand at the end of the period, at cost.
    formula: Sum of stock on hand times unit cost, at period end
    unit: currency
    aggregation: last
    domain: Inventory
  - name: Average Inventory Value
    synonyms: [Average Inventory, Average Stock Value]
    definition: Average value of stock over the period, at cost.
    formula: Average of inventory value at each period end
    unit: currency
    aggregation: average
    domain: Inventory
  - name: Cost of Goods Sold
    synonyms: [COGS, Cost of Sales]
    definition: Cost of the goods sold in the period, the base for inventory turns.
    formula: Sum of units sold times unit cost
    unit: currency
    aggregation: sum
    domain: Inventory
  - name: Inventory Turnover
    synonyms: [Inventory Turns, Stock Turn]
    definition: How many times the stock is sold through in the period.
    formula: Cost of goods sold / Average inventory value
    dax: DIVIDE ( [Cost of Goods Sold], [Average Inventory Value] )
    unit: ratio
    aggregation: ratio
    domain: Inventory
  - name: Days of Inventory
    synonyms: [Days Inventory Outstanding, DIO, Days of Stock]
    definition: How many days of sales the stock covers.
    formula: Average inventory value / Cost of goods sold x Days in the period
    unit: duration
    aggregation: custom
    domain: Inventory
  - name: Load Weight
    synonyms: [Payload, Weight Loaded]
    definition: Weight actually carried by the vehicles.
    formula: Sum of weight loaded per trip
    unit: number
    aggregation: sum
    domain: Fleet
  - name: Vehicle Capacity Weight
    synonyms: [Vehicle Capacity, Truck Capacity]
    definition: Weight the vehicles could have carried on the same trips.
    formula: Sum of rated payload per trip
    unit: number
    aggregation: sum
    domain: Fleet
  - name: Vehicle Fill %
    synonyms: [Truck Utilization, Load Factor, Vehicle Capacity Utilization]
    definition: Share of vehicle capacity that was loaded.
    formula: Load weight / Vehicle capacity weight
    dax: DIVIDE ( [Load Weight], [Vehicle Capacity Weight] )
    unit: percent
    aggregation: ratio
    domain: Fleet
  - name: CO2 Emissions
    synonyms: [Carbon Emissions, Transport Emissions, GHG Emissions]
    definition: Carbon dioxide equivalent emitted by transport, in tonnes.
    formula: Sum of emissions of the trips and shipments
    unit: number
    aggregation: sum
    domain: Fleet

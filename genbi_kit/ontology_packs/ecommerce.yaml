# Industry pack: e-commerce (online retail and marketplaces). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: E-commerce
order: 25
description: Online stores and marketplaces. Traffic and sessions, conversion rate, orders and average order value, discounts and returns, cart and checkout abandonment, marketing efficiency, customer acquisition and repeat purchase, delivery.
questions:
  - What was the conversion rate by traffic channel and device last week?
  - How has average order value changed by customer type and by category this quarter?
  - Where do shoppers drop off - add to cart, checkout or payment - and how has cart abandonment moved?
  - What is the return rate by category and by return reason, and what do returns cost us?
  - Which marketing channels have the best return on ad spend and the lowest customer acquisition cost?
  - What share of this month's customers are repeat buyers, by acquisition month?

terms:

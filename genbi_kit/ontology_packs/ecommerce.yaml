kpis:
  # ---------------- traffic and conversion
  - name: Sessions
    synonyms: [Visits, Site Sessions, Web Sessions, Traffic]
    definition: Visits to the site or app. A session ends after 30 minutes without activity or at midnight; internal and bot traffic excluded.
    formula: Count of distinct sessions
    unit: count
    aggregation: distinct_count
    domain: Traffic
  - name: Unique Visitors
    synonyms: [Visitors, Users, Unique Users]
    definition: Distinct browsers or devices that visited in the period.
    formula: Distinct count of visitor ids
    unit: count
    aggregation: distinct_count
    domain: Traffic
  - name: Orders
    synonyms: [Order Count, Number of Orders, Purchases]
    definition: Orders placed and paid, cancelled orders included (cancellations are reported separately).
    formula: Count of distinct orders
    unit: count
    aggregation: distinct_count
    time: by order date
    domain: Sales
  - name: Conversion Rate %
    synonyms: [Conversion Rate, CVR, Session Conversion Rate, Order Conversion Rate]
    definition: Share of sessions that ended in an order.
    formula: Orders / Sessions
    dax: DIVIDE ( [Orders], [Sessions] )
    unit: percent
    aggregation: ratio
    domain: Traffic
  - name: Carts Created
    synonyms: [Add to Carts, Add-to-Cart Sessions, Carts Started]
    definition: Carts started - sessions with at least one item added to the cart.
    formula: Count of distinct carts with an add-to-cart event
    unit: count
    aggregation: distinct_count
    domain: Funnel
  - name: Add-to-Cart Rate %
    synonyms: [ATC Rate, Cart Rate, Session to Cart %]
    definition: Share of sessions that added an item to the cart.
    formula: Carts created / Sessions
    dax: DIVIDE ( [Carts Created], [Sessions] )
    unit: percent
    aggregation: ratio
    domain: Funnel
  - name: Checkouts Started
    synonyms: [Checkout Starts, Begin Checkout, Initiated Checkouts]
    definition: Shoppers who began the checkout.
    formula: Count of distinct sessions with a begin-checkout event
    unit: count
    aggregation: distinct_count
    domain: Funnel
  - name: Cart Abandonment Rate %
    synonyms: [Cart Abandonment, Abandoned Cart Rate, Cart Abandonment %]
    definition: Share of carts that did not end in an order.
    formula: 1 - Orders / Carts created
    dax: 1 - DIVIDE ( [Orders], [Carts Created] )
    unit: percent
    aggregation: ratio
    domain: Funnel
  - name: Checkout Abandonment Rate %
    synonyms: [Checkout Abandonment, Checkout Drop-Off %]
    definition: Share of started checkouts that did not end in an order.
    formula: 1 - Orders / Checkouts started
    dax: 1 - DIVIDE ( [Orders], [Checkouts Started] )
    unit: percent
    aggregation: ratio
    domain: Funnel
  # ---------------- revenue and margin
  - name: Gross Sales
    synonyms: [Gross Merchandise Value, GMV, Gross Revenue, Gross Demand]
    definition: Value of goods ordered at full price, before discounts, returns, taxes and shipping.
    formula: Sum of unit price times quantity ordered
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Discounts
    synonyms: [Discount Amount, Promo Discounts, Coupon Discounts]
    definition: Price reductions given through coupons, promotions and markdowns.
    formula: Sum of discounts applied to orders
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Order Revenue
    synonyms: [Net Order Value, Revenue before Returns, Ordered Revenue]
    definition: Value of goods ordered after discounts, before refunds. Taxes and shipping are not included.
    formula: Gross sales - Discounts
    dax: '[Gross Sales] - [Discounts]'
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Refunds
    synonyms: [Refund Amount, Refunded Revenue]
    definition: Money paid back to customers for returns and cancellations.
    formula: Sum of refunds issued
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Net Revenue
    synonyms: [Net Sales, Revenue, Total Revenue]
    definition: Order revenue after refunds - what the store keeps from the goods sold.
    formula: Order revenue - Refunds
    dax: '[Order Revenue] - [Refunds]'
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Average Order Value
    synonyms: [AOV, Average Basket Value, Average Order Size]
    definition: Order revenue per order.
    formula: Order revenue / Orders
    dax: DIVIDE ( [Order Revenue], [Orders] )
    unit: currency
    aggregation: ratio
    domain: Sales
  - name: Units Sold
    synonyms: [Units, Items Sold, Units Ordered]
    definition: Items ordered, before returns.
    formula: Sum of quantity ordered
    unit: count
    aggregation: sum
    domain: Sales
  - name: Units per Order
    synonyms: [Items per Order, Average Basket Size, UPO]
    definition: Items ordered per order.
    formula: Units sold / Orders
    dax: DIVIDE ( [Units Sold], [Orders] )
    unit: number
    aggregation: ratio
    domain: Sales
  - name: Revenue per Session
    synonyms: [RPS, Revenue per Visit, Sales per Session]
    definition: Order revenue per session.
    formula: Order revenue / Sessions
    dax: DIVIDE ( [Order Revenue], [Sessions] )
    unit: currency
    aggregation: ratio
    domain: Traffic
  - name: Discount Rate %
    synonyms: [Discount %, Discount Share, Markdown Rate]
    definition: Discounts as a share of gross sales.
    formula: Discounts / Gross sales
    dax: DIVIDE ( [Discounts], [Gross Sales] )
    unit: percent
    aggregation: ratio
    domain: Sales
  - name: Cost of Goods Sold
    synonyms: [COGS, Cost of Sales, Product Cost]
    definition: Purchase or production cost of the items sold, returned items taken out.
    formula: Sum of units sold times unit cost, less cost of units returned to stock
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Gross Margin
    synonyms: [Gross Profit, Gross Margin $, Product Margin]
    definition: Net revenue less cost of goods sold, before shipping, payment fees and marketing.
    formula: Net revenue - Cost of goods sold
    dax: '[Net Revenue] - [Cost of Goods Sold]'
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Gross Margin %
    synonyms: [GM %, Gross Margin Rate, Gross Profit %]
    definition: Gross margin as a share of net revenue.
    formula: Gross margin / Net revenue
    dax: DIVIDE ( [Gross Margin], [Net Revenue] )
    unit: percent
    aggregation: ratio
    domain: Margin
  - name: Shipping Cost
    synonyms: [Delivery Cost, Outbound Shipping Cost, Freight Cost]
    definition: What the store pays carriers to deliver orders, free-shipping orders included.
    formula: Sum of carrier charges for outbound shipments
    unit: currency
    aggregation: sum
    domain: Fulfillment
  - name: Shipping Cost % of Revenue
    synonyms: [Shipping Cost %, Delivery Cost %, Shipping as % of Sales]
    definition: Shipping cost as a share of order revenue.
    formula: Shipping cost / Order revenue
    dax: DIVIDE ( [Shipping Cost], [Order Revenue] )
    unit: percent
    aggregation: ratio
    domain: Fulfillment
  # ---------------- returns and fulfillment
  - name: Returned Units
    synonyms: [Units Returned, Items Returned, Returns]
    definition: Items sent back by customers, by return date.
    formula: Sum of quantity returned
    unit: count
    aggregation: sum
    time: by return date
    domain: Returns
  - name: Return Rate %
    synonyms: [Returns Rate, Return %, Product Return Rate]
    definition: Returned units as a share of units sold. Measure it on orders old enough for returns to have come in.
    formula: Returned units / Units sold
    dax: DIVIDE ( [Returned Units], [Units Sold] )
    unit: percent
    aggregation: ratio
    domain: Returns
  - name: Cancelled Orders
    synonyms: [Canceled Orders, Order Cancellations]
    definition: Orders cancelled before delivery.
    formula: Count of orders with status = Cancelled
    unit: count
    aggregation: distinct_count
    domain: Fulfillment
  - name: Order Cancellation Rate %
    synonyms: [Cancellation Rate, Cancellation %, Order Cancel Rate]
    definition: Share of orders cancelled.
    formula: Cancelled orders / Orders
    dax: DIVIDE ( [Cancelled Orders], [Orders] )
    unit: percent
    aggregation: ratio
    domain: Fulfillment
  - name: Average Delivery Days
    synonyms: [Delivery Time, Average Delivery Time, Order to Delivery Days]
    definition: Average days from order to delivery for delivered orders.
    formula: Average of (delivery date - order date) in days
    unit: duration
    aggregation: average
    domain: Fulfillment
  # ---------------- marketing
  - name: Marketing Spend
    synonyms: [Ad Spend, Advertising Spend, Paid Media Spend, Marketing Cost]
    definition: Money spent on advertising and acquisition (media, agency fees and affiliate payouts).
    formula: Sum of marketing and advertising costs
    unit: currency
    aggregation: sum
    domain: Marketing
  - name: Impressions
    synonyms: [Ad Impressions, Impression Count]
    definition: Times an ad was shown.
    formula: Sum of ad impressions
    unit: count
    aggregation: sum
    domain: Marketing
  - name: Clicks
    synonyms: [Ad Clicks, Click Count]
    definition: Clicks on ads.
    formula: Sum of ad clicks
    unit: count
    aggregation: sum
    domain: Marketing
  - name: Click-Through Rate %
    synonyms: [CTR, CTR %, Click Rate]
    definition: Share of ad impressions that were clicked.
    formula: Clicks / Impressions
    dax: DIVIDE ( [Clicks], [Impressions] )
    unit: percent
    aggregation: ratio
    domain: Marketing
  - name: Cost per Click
    synonyms: [CPC, Average CPC]
    definition: Marketing spend per click.
    formula: Marketing spend / Clicks
    dax: DIVIDE ( [Marketing Spend], [Clicks] )
    unit: currency
    aggregation: ratio
    domain: Marketing
  - name: Attributed Revenue
    synonyms: [Campaign Revenue, Ad Revenue, Conversion Value]
    definition: Revenue credited to a campaign or channel by the attribution model in use.
    formula: Sum of order revenue credited to campaigns
    unit: currency
    aggregation: sum
    time: attribution window as agreed (for example 7-day click)
    domain: Marketing
  - name: ROAS
    synonyms: [Return on Ad Spend, Return on Advertising Spend, Ad ROAS]
    definition: Attributed revenue for each unit of marketing spend.
    formula: Attributed revenue / Marketing spend
    dax: DIVIDE ( [Attributed Revenue], [Marketing Spend] )
    unit: ratio
    aggregation: ratio
    domain: Marketing
  # ---------------- customers
  - name: Active Customers
    synonyms: [Customers, Buyers, Unique Customers, Ordering Customers]
    definition: Distinct customers who placed at least one order in the period.
    formula: Distinct count of customers with an order
    unit: count
    aggregation: distinct_count
    domain: Customers
  - name: New Customers
    synonyms: [New Buyers, First-Time Customers, First Time Buyers]
    definition: Customers whose first ever order was in the period.
    formula: Distinct count of customers with first order date in the period
    unit: count
    aggregation: distinct_count
    time: by first order date
    domain: Customers
  - name: Repeat Customers
    synonyms: [Returning Customers, Repeat Buyers, Returning Buyers]
    definition: Customers who ordered in the period and had ordered before.
    formula: Distinct count of customers with an order and an earlier first order date
    unit: count
    aggregation: distinct_count
    domain: Customers
  - name: Repeat Purchase Rate %
    synonyms: [Repeat Rate, Repeat Customer Rate, Returning Customer Rate]
    definition: Share of active customers who are repeat customers.
    formula: Repeat customers / Active customers
    dax: DIVIDE ( [Repeat Customers], [Active Customers] )
    unit: percent
    aggregation: ratio
    domain: Customers
  - name: Customer Acquisition Cost
    synonyms: [CAC, Cost per New Customer, Cost per Acquisition]
    definition: Marketing spend for each new customer.
    formula: Marketing spend / New customers
    dax: DIVIDE ( [Marketing Spend], [New Customers] )
    unit: currency
    aggregation: ratio
    domain: Customers
  - name: Revenue per Customer
    synonyms: [Average Revenue per Customer, ARPC, Revenue per Active Customer]
    definition: Net revenue for each active customer.
    formula: Net revenue / Active customers
    dax: DIVIDE ( [Net Revenue], [Active Customers] )
    unit: currency
    aggregation: ratio
    domain: Customers
  - name: Average Product Rating
    synonyms: [Average Rating, Review Rating, Star Rating]
    definition: Average review rating of the products, in stars.
    formula: Average of review ratings
    unit: number
    aggregation: average
    domain: Customers

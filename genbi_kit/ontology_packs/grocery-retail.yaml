kpis:
  # ---------------- sales
  - name: Net Sales
    synonyms: [Sales, Total Sales, Revenue, Net Revenue]
    definition: Sales after discounts, coupons and returns, at the register and online.
    formula: Gross sales - discounts - coupons - returns
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Gross Sales
    definition: Sales before discounts, coupons and returns.
    formula: Sum of items sold times their regular price
    unit: currency
    aggregation: sum
    domain: Sales
  - name: Net Sales LY
    synonyms: [Sales LY, Net Sales Last Year]
    definition: Net sales in the same period last year (same fiscal weeks).
    formula: Net sales for the same fiscal period one year earlier
    unit: currency
    aggregation: sum
    time: fiscal year (52 or 53 weeks), same fiscal weeks last year
    domain: Sales
  - name: Sales Growth %
    synonyms: [Sales vs LY %, YoY Sales Growth, Net Sales Growth %]
    definition: Change in net sales against the same period last year.
    formula: (Net sales - Net sales last year) / Net sales last year
    dax: DIVIDE ( [Net Sales] - [Net Sales LY], [Net Sales LY] )
    unit: percent
    aggregation: ratio
    domain: Sales
  - name: Identical Store Sales Growth %
    synonyms: [ID Sales %, Comp Sales %, Comparable Store Sales Growth, Same Store Sales Growth, LFL Sales %]
    definition: Sales growth against last year for stores open in both periods, so new and closed stores do not distort it.
    formula: (Net sales of identical stores - their net sales last year) / their net sales last year
    filters: [Stores open at least 12 full months in both periods, Excludes fuel sales]
    unit: percent
    aggregation: ratio
    domain: Sales
  - name: Units Sold
    synonyms: [Units, Unit Sales, Quantity Sold]
    definition: Items sold, net of returns.
    formula: Sum of units sold - units returned
    unit: count
    aggregation: sum
    domain: Sales
  - name: Transactions
    synonyms: [Customer Count, Baskets, Transaction Count, Trips]
    definition: Number of register and online transactions (baskets).
    formula: Count of distinct transactions
    unit: count
    aggregation: distinct_count
    domain: Customers
  - name: Average Basket Value
    synonyms: [Average Transaction Value, ATV, Average Ticket, Basket Value, Avg Basket]
    definition: Net sales per transaction.
    formula: Net sales / Transactions
    dax: DIVIDE ( [Net Sales], [Transactions] )
    unit: currency
    aggregation: ratio
    domain: Customers
  - name: Units per Transaction
    synonyms: [UPT, Basket Size, Items per Basket]
    definition: Items sold per transaction.
    formula: Units sold / Transactions
    dax: DIVIDE ( [Units Sold], [Transactions] )
    unit: number
    aggregation: ratio
    domain: Customers
  - name: Average Unit Retail
    synonyms: [AUR, Average Selling Price, ASP, Average Item Price]
    definition: Net sales per unit sold.
    formula: Net sales / Units sold
    dax: DIVIDE ( [Net Sales], [Units Sold] )
    unit: currency
    aggregation: ratio
    domain: Sales
  - name: Store Count
    synonyms: [Number of Stores, Stores Selling]
    definition: Stores with sales in the period.
    formula: Distinct count of stores with net sales
    unit: count
    aggregation: distinct_count
    domain: Stores
  - name: Average Weekly Sales per Store
    synonyms: [Sales per Store per Week, AWS]
    definition: Net sales per store per fiscal week.
    formula: Net sales / Store count / Number of fiscal weeks
    unit: currency
    aggregation: ratio
    domain: Stores
  - name: Selling Square Feet
    synonyms: [Square Feet, Selling Area]
    definition: Selling area of the stores in the selection.
    formula: Sum of each store's selling square feet
    unit: number
    aggregation: sum
    domain: Stores
  - name: Sales per Square Foot
    synonyms: [Sales per Sq Ft, Sales Density]
    definition: Net sales per square foot of selling space.
    formula: Net sales / Selling square feet
    dax: DIVIDE ( [Net Sales], [Selling Square Feet] )
    unit: currency
    aggregation: ratio
    domain: Stores
  # ---------------- margin and pricing
  - name: Cost of Goods Sold
    synonyms: [COGS, Cost of Sales]
    definition: Cost of the goods sold, net of vendor allowances where they are booked against cost.
    formula: Sum of units sold times their unit cost
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Gross Margin
    synonyms: [Gross Profit, Margin $, GM $, Gross Margin $]
    definition: Net sales less the cost of goods sold.
    formula: Net sales - Cost of goods sold
    dax: '[Net Sales] - [Cost of Goods Sold]'
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Gross Margin %
    synonyms: [GM %, Gross Margin Rate, Margin %, Gross Profit %]
    definition: Gross margin as a share of net sales.
    formula: Gross margin / Net sales
    dax: DIVIDE ( [Gross Margin], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Margin
  - name: Discounts
    synonyms: [Markdowns, Markdown $, Discount Amount]
    definition: Price reductions given at the register, promotions included, coupons excluded.
    formula: Sum of discount amounts
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Markdown %
    synonyms: [Discount %, Markdown Rate]
    definition: Discounts as a share of gross sales.
    formula: Discounts / Gross sales
    dax: DIVIDE ( [Discounts], [Gross Sales] )
    unit: percent
    aggregation: ratio
    domain: Margin
  - name: Promo Sales
    synonyms: [Promotional Sales, Sales on Promotion]
    definition: Net sales of items sold on promotion.
    formula: Net sales where the item was on promotion
    filters: [Promo flag = Yes]
    unit: currency
    aggregation: sum
    domain: Margin
  - name: Promo Sales %
    synonyms: [Promo Penetration %, Promotional Sales Share]
    definition: Share of net sales sold on promotion.
    formula: Promo sales / Net sales
    dax: DIVIDE ( [Promo Sales], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Margin
  - name: Vendor Funding
    synonyms: [Allowances, Vendor Allowances, Promo Funding]
    definition: Allowances and promotional funds received from vendors.
    formula: Sum of scan, bill-back and other vendor allowances
    unit: currency
    aggregation: sum
    domain: Margin
  # ---------------- own brands, digital, loyalty
  - name: Own Brands Sales
    synonyms: [Private Label Sales, Store Brand Sales, Own Brand Sales]
    definition: Net sales of the retailer's own (private label) brands.
    formula: Net sales where the item is an own brand
    filters: [Own brand flag = Yes]
    unit: currency
    aggregation: sum
    domain: Own Brands
  - name: Own Brands Penetration %
    synonyms: [Private Label Share, Own Brands Share, Private Label Penetration %, Own Brand %]
    definition: Own brands' share of net sales.
    formula: Own brands sales / Net sales
    dax: DIVIDE ( [Own Brands Sales], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Own Brands
  - name: Digital Sales
    synonyms: [eCommerce Sales, Online Sales, Digital Revenue]
    definition: Net sales of orders placed online, delivery and pickup.
    formula: Net sales where the channel is delivery or pickup
    filters: [Channel in Delivery, Pickup]
    unit: currency
    aggregation: sum
    domain: Digital
  - name: Digital Sales Penetration %
    synonyms: [eCommerce Penetration, Digital Share, Online Penetration %]
    definition: Digital sales as a share of net sales.
    formula: Digital sales / Net sales
    dax: DIVIDE ( [Digital Sales], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Digital
  - name: Online Orders
    synonyms: [Digital Orders, eCommerce Orders]
    definition: Orders placed online.
    formula: Count of distinct online orders
    unit: count
    aggregation: distinct_count
    domain: Digital
  - name: Average Order Value
    synonyms: [AOV, Digital Basket, Average Online Order]
    definition: Digital sales per online order.
    formula: Digital sales / Online orders
    dax: DIVIDE ( [Digital Sales], [Online Orders] )
    unit: currency
    aggregation: ratio
    domain: Digital
  - name: Loyalty Sales
    synonyms: [Tracked Sales, Member Sales, Club Card Sales]
    definition: Net sales with a loyalty card or member account.
    formula: Net sales where a customer id is present
    unit: currency
    aggregation: sum
    domain: Loyalty
  - name: Loyalty Sales Penetration %
    synonyms: [Tracked Sales %, Member Sales Share]
    definition: Share of net sales made by loyalty members.
    formula: Loyalty sales / Net sales
    dax: DIVIDE ( [Loyalty Sales], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Loyalty
  - name: Active Members
    synonyms: [Active Households, Active Loyalty Members]
    definition: Loyalty households that bought at least once in the last 52 weeks.
    formula: Distinct count of households with a purchase in the last 52 weeks
    unit: count
    aggregation: distinct_count
    time: rolling 52 weeks
    domain: Loyalty
  # ---------------- shrink, waste, inventory, supply chain
  - name: Shrink
    synonyms: [Shrinkage, Shrink $, Inventory Loss]
    definition: Value of inventory lost to theft, damage, spoilage and administrative errors, at cost.
    formula: Book inventory - physical inventory, plus recorded losses
    unit: currency
    aggregation: sum
    domain: Shrink
  - name: Shrink %
    synonyms: [Shrink % of Sales, Shrink Rate]
    definition: Shrink as a share of net sales.
    formula: Shrink / Net sales
    dax: DIVIDE ( [Shrink], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Shrink
  - name: Waste
    synonyms: [Spoilage, Fresh Waste, Throwaway]
    definition: Value of fresh product thrown away, at cost.
    formula: Sum of recorded waste
    unit: currency
    aggregation: sum
    domain: Shrink
  - name: Waste %
    synonyms: [Spoilage %, Waste % of Sales]
    definition: Waste as a share of net sales.
    formula: Waste / Net sales
    dax: DIVIDE ( [Waste], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Shrink
  - name: Out of Stock Rate %
    synonyms: [OOS %, Stockout Rate, Out of Stock %]
    definition: Share of item and store combinations with no stock when checked.
    formula: Out-of-stock item-store checks / All item-store checks
    unit: percent
    aggregation: ratio
    domain: Inventory
  - name: In-Stock Rate %
    synonyms: [In Stock %, On-Shelf Availability, OSA %]
    definition: Share of item and store combinations in stock when checked.
    formula: 1 - Out-of-stock rate
    dax: 1 - [Out of Stock Rate %]
    unit: percent
    aggregation: ratio
    domain: Inventory
  - name: Average Inventory Value
    synonyms: [Average Inventory, Avg Inventory at Cost]
    definition: Average value of the stock on hand over the period, at cost.
    formula: Average of the inventory value at each period end
    unit: currency
    aggregation: average
    domain: Inventory
  - name: Inventory Turnover
    synonyms: [Inventory Turns, Stock Turn]
    definition: How many times the inventory is sold through in the period.
    formula: Cost of goods sold / Average inventory value
    dax: DIVIDE ( [Cost of Goods Sold], [Average Inventory Value] )
    unit: ratio
    aggregation: ratio
    domain: Inventory
  - name: GMROI
    synonyms: [Gross Margin Return on Inventory, GMROII]
    definition: Gross margin earned for each dollar of average inventory.
    formula: Gross margin / Average inventory value
    dax: DIVIDE ( [Gross Margin], [Average Inventory Value] )
    unit: ratio
    aggregation: ratio
    domain: Inventory
  - name: Weeks of Supply
    synonyms: [WOS, Weeks of Cover, Stock Cover]
    definition: How many weeks the stock on hand lasts at the recent rate of sale.
    formula: Units on hand / Average weekly units sold (last 4 weeks)
    unit: duration
    aggregation: custom
    domain: Inventory
  - name: Fill Rate %
    synonyms: [Order Fill Rate, Case Fill Rate, Vendor Fill Rate]
    definition: Share of ordered units that were shipped.
    formula: Shipped units / Ordered units
    unit: percent
    aggregation: ratio
    domain: Supply Chain
  - name: On-Time In-Full %
    synonyms: [OTIF, OTIF %, On Time In Full]
    definition: Share of deliveries that arrived on time and complete.
    formula: Deliveries on time and in full / All deliveries
    unit: percent
    aggregation: ratio
    domain: Supply Chain
  # ---------------- labor, pharmacy, fuel
  - name: Labor Hours
    synonyms: [Hours Worked, Paid Hours]
    definition: Hours worked by store staff.
    formula: Sum of hours worked
    unit: number
    aggregation: sum
    domain: Labor
  - name: Sales per Labor Hour
    synonyms: [SPLH, Labor Productivity]
    definition: Net sales per hour worked.
    formula: Net sales / Labor hours
    dax: DIVIDE ( [Net Sales], [Labor Hours] )
    unit: currency
    aggregation: ratio
    domain: Labor
  - name: Labor Cost
    synonyms: [Payroll, Wages]
    definition: Wages and payroll cost of store staff.
    formula: Sum of wages and payroll costs
    unit: currency
    aggregation: sum
    domain: Labor
  - name: Labor Cost %
    synonyms: [Labor % of Sales, Payroll %]
    definition: Labor cost as a share of net sales.
    formula: Labor cost / Net sales
    dax: DIVIDE ( [Labor Cost], [Net Sales] )
    unit: percent
    aggregation: ratio
    domain: Labor
  - name: Prescriptions Filled
    synonyms: [Scripts, Rx Count, Script Count]
    definition: Prescriptions filled by the pharmacies.
    formula: Count of prescriptions filled
    unit: count
    aggregation: sum
    domain: Pharmacy
  - name: Pharmacy Sales
    synonyms: [Rx Sales, Prescription Sales]
    definition: Net sales of prescriptions.
    formula: Sum of prescription sales
    unit: currency
    aggregation: sum
    domain: Pharmacy
  - name: Average Prescription Value
    synonyms: [Average Script Value, Rx per Script]
    definition: Pharmacy sales per prescription filled.
    formula: Pharmacy sales / Prescriptions filled
    dax: DIVIDE ( [Pharmacy Sales], [Prescriptions Filled] )
    unit: currency
    aggregation: ratio
    domain: Pharmacy
  - name: Fuel Gallons
    synonyms: [Gallons Sold, Fuel Volume]
    definition: Gallons of fuel sold.
    formula: Sum of gallons sold
    unit: number
    aggregation: sum
    domain: Fuel
  - name: Fuel Margin per Gallon
    synonyms: [Cents per Gallon, CPG, Fuel CPG]
    definition: Fuel gross margin per gallon sold.
    formula: Fuel gross margin / Fuel gallons
    dax: DIVIDE ( [Fuel Gross Margin], [Fuel Gallons] )
    unit: currency
    aggregation: ratio
    domain: Fuel
  - name: Fuel Gross Margin
    synonyms: [Fuel Margin, Fuel Gross Profit]
    definition: Fuel sales less the cost of the fuel sold.
    formula: Fuel sales - Fuel cost
    unit: currency
    aggregation: sum
    domain: Fuel
  - name: Return Rate %
    synonyms: [Returns %, Refund Rate]
    definition: Returns as a share of gross sales.
    formula: Returns / Gross sales
    dax: DIVIDE ( [Returns], [Gross Sales] )
    unit: percent
    aggregation: ratio
    domain: Sales
  - name: Returns
    synonyms: [Refunds, Return Amount]
    definition: Value of goods returned and refunded.
    formula: Sum of refunds
    unit: currency
    aggregation: sum
    domain: Sales

# Industry pack: grocery and food-and-drug retail (item 61). Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields). A KPI built from other KPIs has
# reference DAX naming them by [name]; a base KPI has a definition and formula in words only, so it fits any model.
name: Grocery and retail
order: 10
description: Supermarkets, food and drug stores, pharmacy, fuel and digital grocery. Store and item sales, baskets, margin, shrink, own brands, in-stock, supply chain, labor and loyalty.
questions:
  - What were net sales by division last week, and how do they compare with last year?
  - Which 10 stores have the highest shrink as a percent of sales this quarter?
  - How has own brands penetration changed by department over the last 13 periods?
  - Which categories grew digital sales penetration the most this year?
  - Where is the in-stock rate below 95 percent, by store and department?
  - What is the average basket value by banner and channel?


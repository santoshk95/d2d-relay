# Industry pack: banking and lending. Business terms tag columns by name (genbi_kit/ontology.py);
# KPIs go into the organisation's KPI dictionary (genbi_kit/semreview/kpis.py fields).
name: Banking and lending
order: 60
description: Retail, commercial and digital banks and lenders. Loans and disbursements, deposits and CASA, interest margin, non-performing loans, provisions, cost-to-income, cards, branches and capital.
questions:
  - What is the gross NPA percent by loan product and by branch, and how has it moved over the last 12 months?
  - Which branches have the lowest CASA ratio, and what is their deposit growth?
  - How has net interest margin changed this year compared with last year?
  - What were loan disbursements by product and region this quarter?
  - Which loan buckets are moving into 30 or more days past due?
  - What share of transactions is digital, by customer segment?


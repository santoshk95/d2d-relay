kpis:
  # ---------------- loans and asset quality
  - name: Gross Loans
    synonyms: [Gross Advances, Loan Book, Loan Portfolio, Loans Outstanding]
    definition: Principal outstanding on all loans at the end of the period, before provisions.
    formula: Sum of loan principal outstanding at period end
    unit: currency
    aggregation: last
    domain: Lending
  - name: Disbursements
    synonyms: [Loan Disbursements, New Lending, Originations]
    definition: Loan money paid out to borrowers in the period.
    formula: Sum of amounts disbursed
    unit: currency
    aggregation: sum
    time: by disbursement date
    domain: Lending
  - name: Active Loans
    synonyms: [Loan Accounts, Number of Loans]
    definition: Loan accounts with an outstanding balance at the end of the period.
    formula: Count of loan accounts with principal outstanding
    unit: count
    aggregation: distinct_count
    domain: Lending
  - name: Delinquent Balance
    synonyms: [Overdue Loans, 30+ DPD Balance, Past Due Balance]
    definition: Outstanding principal on loans 30 or more days past due.
    formula: Sum of principal outstanding where days past due >= 30
    filters: [Days past due >= 30]
    unit: currency
    aggregation: last
    domain: Asset Quality
  - name: Delinquency Rate %
    synonyms: [30+ DPD %, Delinquency %, Past Due Rate]
    definition: Share of the loan book that is 30 or more days past due.
    formula: Delinquent balance / Gross loans
    dax: DIVIDE ( [Delinquent Balance], [Gross Loans] )
    unit: percent
    aggregation: ratio
    domain: Asset Quality
  - name: Gross NPA
    synonyms: [Gross NPL, Non-Performing Loans, NPA Balance, Gross Non-Performing Assets]
    definition: Outstanding on loans classified non-performing - 90 or more days past due, or as the regulator defines.
    formula: Sum of principal outstanding where the loan is non-performing
    filters: [NPA flag = Yes]
    unit: currency
    aggregation: last
    domain: Asset Quality
  - name: Gross NPA %
    synonyms: [Gross NPA Ratio, GNPA %, NPL Ratio, NPL %, Non-Performing Loan Ratio]
    definition: Gross non-performing loans as a share of gross loans.
    formula: Gross NPA / Gross loans
    dax: DIVIDE ( [Gross NPA], [Gross Loans] )
    unit: percent
    aggregation: ratio
    domain: Asset Quality
  - name: NPA Provisions
    synonyms: [Provisions Held Against NPAs, NPA Provision Held, Loan Loss Reserve on NPAs]
    definition: Provisions held against non-performing loans at the end of the period.
    formula: Sum of loan loss provisions on non-performing loans
    unit: currency
    aggregation: last
    domain: Asset Quality
  - name: Net NPA
    synonyms: [Net NPL, Net Non-Performing Assets]
    definition: Gross non-performing loans less the provisions held against them.
    formula: Gross NPA - NPA provisions
    dax: '[Gross NPA] - [NPA Provisions]'
    unit: currency
    aggregation: last
    domain: Asset Quality
  - name: Net NPA %
    synonyms: [Net NPA Ratio, NNPA %, Net NPL Ratio]
    definition: Net non-performing loans as a share of gross loans net of NPA provisions.
    formula: Net NPA / (Gross loans - NPA provisions)
    dax: DIVIDE ( [Net NPA], [Gross Loans] - [NPA Provisions] )
    unit: percent
    aggregation: ratio
    domain: Asset Quality
  - name: Provision Coverage Ratio %
    synonyms: [PCR, Provision Coverage, NPA Coverage Ratio]
    definition: Share of gross non-performing loans covered by provisions.
    formula: NPA provisions / Gross NPA
    dax: DIVIDE ( [NPA Provisions], [Gross NPA] )
    unit: percent
    aggregation: ratio
    domain: Asset Quality
  - name: Provisions
    synonyms: [Loan Loss Provisions, Provision Expense, Impairment Charge, Credit Loss Expense]
    definition: Charge to the income statement for expected loan losses in the period.
    formula: Sum of provisions charged to the income statement
    unit: currency
    aggregation: sum
    domain: Profitability
  # ---------------- income and profit
  - name: Interest Income
    synonyms: [Interest Earned, Interest Revenue]
    definition: Interest earned on loans and investments in the period.
    formula: Sum of interest accrued on loans and investments
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Interest Expense
    synonyms: [Interest Paid, Interest Cost]
    definition: Interest paid on deposits and borrowings in the period.
    formula: Sum of interest accrued on deposits and borrowings
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Net Interest Income
    synonyms: [NII, Net Interest Revenue]
    definition: Interest income less interest expense.
    formula: Interest income - Interest expense
    dax: '[Interest Income] - [Interest Expense]'
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Average Earning Assets
    synonyms: [Interest Earning Assets, Average IEA]
    definition: Average balance of assets that earn interest over the period (loans, investments, balances with other banks).
    formula: Average of daily earning assets
    unit: currency
    aggregation: average
    domain: Profitability
  - name: Net Interest Margin %
    synonyms: [NIM, NIM %, Net Interest Margin]
    definition: Net interest income as a share of average earning assets, annualised when the period is shorter than a year.
    formula: Net interest income / Average earning assets
    dax: DIVIDE ( [Net Interest Income], [Average Earning Assets] )
    unit: percent
    aggregation: ratio
    time: annualised for periods shorter than a year
    domain: Profitability
  - name: Fee Income
    synonyms: [Non-Interest Income, Fees and Commissions, Noninterest Income]
    definition: Income from fees and commissions, not from interest.
    formula: Sum of fee and commission income
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Total Operating Income
    synonyms: [Operating Income, Total Income, Net Revenue]
    definition: Net interest income plus fee income.
    formula: Net interest income + Fee income
    dax: '[Net Interest Income] + [Fee Income]'
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Operating Expense
    synonyms: [Operating Expenses, Opex, Non-Interest Expense]
    definition: Cost of running the bank - staff, premises and technology - before provisions.
    formula: Sum of staff, premises, technology and other operating costs
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Cost to Income Ratio %
    synonyms: [Cost-to-Income Ratio, Efficiency Ratio, CIR]
    definition: Operating expense as a share of total operating income - lower is better.
    formula: Operating expense / Total operating income
    dax: DIVIDE ( [Operating Expense], [Total Operating Income] )
    unit: percent
    aggregation: ratio
    domain: Profitability
  - name: Net Profit
    synonyms: [Net Income, Profit After Tax, PAT]
    definition: Profit after operating expense, provisions and tax.
    formula: Total operating income - Operating expense - Provisions - Tax
    unit: currency
    aggregation: sum
    domain: Profitability
  - name: Average Total Assets
    synonyms: [Average Assets, Total Assets]
    definition: Average size of the balance sheet over the period.
    formula: Average of daily total assets
    unit: currency
    aggregation: average
    domain: Profitability
  - name: Return on Assets %
    synonyms: [ROA, ROA %, Return on Average Assets]
    definition: Net profit as a share of average total assets, annualised when the period is shorter than a year.
    formula: Net profit / Average total assets
    dax: DIVIDE ( [Net Profit], [Average Total Assets] )
    unit: percent
    aggregation: ratio
    time: annualised for periods shorter than a year
    domain: Profitability
  # ---------------- deposits and customers
  - name: Total Deposits
    synonyms: [Deposits, Deposit Balance, Customer Deposits]
    definition: Money customers hold in all deposit accounts at the end of the period.
    formula: Sum of closing balances of current, savings and term deposit accounts
    unit: currency
    aggregation: last
    domain: Deposits
  - name: Current Account Deposits
    synonyms: [Current Deposits, CA Balance, Demand Deposits]
    definition: Balances in current (checking) accounts at the end of the period.
    formula: Sum of closing balances of current accounts
    unit: currency
    aggregation: last
    domain: Deposits
  - name: Savings Account Deposits
    synonyms: [Savings Deposits, SA Balance, SB Balance]
    definition: Balances in savings accounts at the end of the period.
    formula: Sum of closing balances of savings accounts
    unit: currency
    aggregation: last
    domain: Deposits
  - name: CASA Deposits
    synonyms: [CASA Balance, Current and Savings Deposits, CASA]
    definition: Current plus savings account balances - the low-cost deposits.
    formula: Current account deposits + Savings account deposits
    dax: '[Current Account Deposits] + [Savings Account Deposits]'
    unit: currency
    aggregation: last
    domain: Deposits
  - name: CASA Ratio %
    synonyms: [CASA %, CASA Share, CASA Ratio]
    definition: Share of total deposits held in current and savings accounts.
    formula: CASA deposits / Total deposits
    dax: DIVIDE ( [CASA Deposits], [Total Deposits] )
    unit: percent
    aggregation: ratio
    domain: Deposits
  - name: Credit Deposit Ratio %
    synonyms: [CD Ratio, Loan to Deposit Ratio, LDR, Credit-Deposit Ratio]
    definition: Gross loans as a share of total deposits.
    formula: Gross loans / Total deposits
    dax: DIVIDE ( [Gross Loans], [Total Deposits] )
    unit: percent
    aggregation: ratio
    domain: Deposits
  - name: Active Customers
    synonyms: [Customers, Customer Count, Customer Base]
    definition: Distinct customers with at least one active account or a transaction in the last 12 months.
    formula: Distinct count of customers with an active product
    unit: count
    aggregation: distinct_count
    domain: Customers
  - name: Accounts Opened
    synonyms: [New Accounts, Account Openings]
    definition: New accounts opened in the period.
    formula: Count of accounts with an opening date in the period
    unit: count
    aggregation: sum
    time: by account open date
    domain: Customers
  # ---------------- cards, channels and capital
  - name: Active Cards
    synonyms: [Cards in Force, Cards Active, Cards in Issue]
    definition: Cards that were used at least once in the last 90 days.
    formula: Count of cards with a transaction in the last 90 days
    unit: count
    aggregation: distinct_count
    time: rolling 90 days
    domain: Cards
  - name: Card Spend
    synonyms: [Card Spending, Card Purchase Volume, Card Turnover]
    definition: Value of purchases made on cards (cash withdrawals excluded).
    formula: Sum of card purchase transactions
    unit: currency
    aggregation: sum
    domain: Cards
  - name: Spend per Active Card
    synonyms: [Average Card Spend, Card Spend per Card]
    definition: Card spend for each active card.
    formula: Card spend / Active cards
    dax: DIVIDE ( [Card Spend], [Active Cards] )
    unit: currency
    aggregation: ratio
    domain: Cards
  - name: Total Transactions
    synonyms: [Transactions, Transaction Volume, Transaction Count]
    definition: Customer transactions across all channels.
    formula: Count of customer transactions
    unit: count
    aggregation: sum
    domain: Channels
  - name: Digital Transactions
    synonyms: [Digital Txns, Online Transactions]
    definition: Transactions made on mobile, internet banking, UPI and online card payments.
    formula: Count of transactions where the channel is digital
    filters: [Channel in Mobile, Internet, UPI, Online card]
    unit: count
    aggregation: sum
    domain: Channels
  - name: Digital Transaction Share %
    synonyms: [Digital Share, Digital Adoption Rate, Digital Penetration %]
    definition: Share of transactions made on digital channels.
    formula: Digital transactions / Total transactions
    dax: DIVIDE ( [Digital Transactions], [Total Transactions] )
    unit: percent
    aggregation: ratio
    domain: Channels
  - name: Regulatory Capital
    synonyms: [Total Capital, Capital Funds, Tier 1 and Tier 2 Capital]
    definition: Tier 1 plus tier 2 capital counted by the regulator.
    formula: Tier 1 capital + Tier 2 capital
    unit: currency
    aggregation: last
    domain: Capital
  - name: Risk Weighted Assets
    synonyms: [RWA, Total RWA]
    definition: Assets and off-balance exposures weighted by credit, market and operational risk.
    formula: Sum of exposures times risk weights
    unit: currency
    aggregation: last
    domain: Capital
  - name: Capital Adequacy Ratio %
    synonyms: [CAR, CRAR, Capital to Risk-Weighted Assets Ratio, Total Capital Ratio]
    definition: Regulatory capital as a share of risk weighted assets.
    formula: Regulatory capital / Risk weighted assets
    dax: DIVIDE ( [Regulatory Capital], [Risk Weighted Assets] )
    unit: percent
    aggregation: ratio
    domain: Capital
